      } else pc.appendChild(el('div', 'cap', '진하게 보이는 날짜를 누르면 그날 당번을 고를 수 있어요. 흐린 날은 바꿀 수 없는 날이에요.'));
      w.appendChild(pc);
      return;
    }
    var card = el('div', 'card'), list = el('div', 'list'), cnt = 0;
    sortedDays(flow.tm).forEach(function (d) {
      if (C.isPast(flow.tm, d)) return;
      var ds = duties(flow.tm)[d] || [];
      if (flow.tm === f.month && d === f.day) return;
      var it = el('div', 'it'); it.style.flexDirection = 'column'; it.style.alignItems = 'stretch';
      var hasMe = ds.indexOf(me) >= 0;
      it.appendChild(el('div', 'd', lab(flow.tm, d)));
      var row = el('div', 'row'); row.style.flexWrap = 'wrap';
      ds.forEach(function (name, j) {
        if (!name || name === me) return;
        var t = slotOf(flow.tm, d, j), ok = canPair(f, t);
        var b = btn('tog', name, function () { flow.target = t; flow.step = 'confirm'; renderFlow(); });
        b.style.flex = '1 1 40%'; b.disabled = !ok; b.setAttribute('aria-label', lab(flow.tm, d) + ' ' + name + ' 님과 교환');
        if (ok) cnt++; row.appendChild(b);
      });
      if (hasMe) it.appendChild(el('div', 'cap', '내가 이미 당번인 날이에요.')); else if (row.children.length) it.appendChild(row); else return;
      list.appendChild(it);
    });
    if (!list.children.length) list.appendChild(el('div', 'cap', '이 달에는 바꿀 수 있는 당번이 없어요. 다른 달을 눌러 보세요.'));
    card.appendChild(list); w.appendChild(card);
  }
  function dIdx(y, m, d) { return (new Date(y, m - 1, d).getDay() + 6) % 7; }
  function ocCond() { var o = flow.oc, wd = o.mode === 'dow' || o.mode === 'both'; return { mode: o.mode, dows: wd ? o.dows.slice().sort() : [], dates: o.mode === 'dow' ? [] : o.dates.slice().sort() }; }
  function ocReady() { var o = flow.oc; return o.mode === 'except' || (o.mode === 'dow' ? o.dows.length > 0 : o.mode === 'both' ? (o.dows.length > 0 && o.dates.length > 0) : o.dates.length > 0); }
  function flowCond(w) {
    var f = flow.from, o = flow.oc;
    w.appendChild(el('h2', '', '언제 당번을 서면 괜찮으세요?'));
    w.appendChild(el('div', 'cap', longLab(f.month, f.day) + ' 당번을 넘기고, 아래 조건의 날과 바꿔요.'));
    var sg = el('div', 'seg'); sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', '조건 방식'); sg.style.flexWrap = 'wrap'; sg.className = 'seg two';
    [['dow', '요일로'], ['dates', '날짜로'], ['both', '요일+날짜'], ['except', '이 날만 빼고']].forEach(function (x) { var b = btn('', x[1], function () { o.mode = x[0]; renderFlow(); }); b.setAttribute('aria-pressed', o.mode === x[0] ? 'true' : 'false'); sg.appendChild(b); });
    w.appendChild(sg);
    var card = el('div', 'card'); card.style.display = 'flex'; card.style.flexDirection = 'column'; card.style.gap = '12px';
    var wdOn = o.mode === 'dow' || o.mode === 'both';
    if (wdOn) {
      card.appendChild(el('div', 'lead', o.mode === 'both' ? '1) 가능한 요일 (여러 개 선택)' : '가능한 요일 (여러 개 선택)'));
      var dr = el('div', 'dowrow');
      DOW.forEach(function (nm, i) { var b = btn('tog', nm, function () { toggle(o.dows, i); if (o.mode === 'both') o.dates = o.dates.filter(function (key) { var q = key.split('-'); return o.dows.indexOf(dIdx(parseInt(q[0], 10), parseInt(q[1], 10), parseInt(q[2], 10))) >= 0; }); renderFlow(); }); b.setAttribute('aria-pressed', o.dows.indexOf(i) >= 0 ? 'true' : 'false'); dr.appendChild(b); });
      card.appendChild(dr);
    }
    if (o.mode !== 'dow') {
      card.appendChild(el('div', 'lead', o.mode === 'dates' ? '가능한 날짜 (여러 개 선택)' : o.mode === 'both' ? '2) 그 요일 중 가능한 날짜 (여러 개 선택)' : '안 되는 날짜 (여러 개 선택)'));
      var dd = el('div', 'dates');
      C_days().forEach(function (x) {
        if (x.k === f.month && x.d === f.day) return;
        if (o.mode === 'both' && o.dows.indexOf(dIdx.apply(null, C.parseKey(x.k).slice(0, 2).concat([x.d]))) < 0) return;
        var key = C.dkey(x.k, x.d), b = btn('tog', lab(x.k, x.d), function () { toggle(o.dates, key); renderFlow(); });
        b.setAttribute('aria-pressed', o.dates.indexOf(key) >= 0 ? 'true' : 'false'); dd.appendChild(b);
      });
      if (!dd.children.length) dd.appendChild(el('div', 'cap', o.mode === 'both' ? '먼저 위에서 요일을 골라 주세요.' : '선택할 수 있는 날짜가 없어요.'));
      card.appendChild(dd);
    }
    w.appendChild(card);
    var pp = myPendingOn(f, false).length;
    if (pp) w.appendChild(el('div', 'card cap', '이 당번으로 보낸 기존 요청 ' + pp + '건은 새로 올리면 취소돼요.'));
    var sm = el('div', 'card cap', ocReady() ? '조건: ' + C.condText(ocCond()) + ' · 맞는 분이 앱에서 수락하면 바로 바뀌어요.' : '위에서 조건을 골라 주세요.'); w.appendChild(sm);
    var go = btn('btn pri', '교환 가능한 회원 찾기', sendOpen); go.disabled = !ocReady() || isLocked(f.month) || flow.busy; w.appendChild(go);
  }
  function C_days() { var out = []; keys.forEach(function (k) { sortedDays(k).forEach(function (d) { if (!C.expired(k, d)) out.push({ k: k, d: d }); }); }); return out; }
  function flowConfirm(w) {
    var f = flow.from, t = flow.target;
    w.appendChild(el('h2', '', t.name + ' 님께 이렇게 요청할까요?'));
    var cmp = el('div', 'cmp');
    var fn = namesOf(f.month, f.day), tn = namesOf(t.month, t.day);
    var swapN = function (arr, a, b) { return arr.map(function (x) { return x === a ? b : x; }); };
    function nm(arr) { return arr.map(function (x) { return x === me ? '나' : x; }).join(' · '); }
    cmp.appendChild(cmpBlock('now', [[lab(f.month, f.day), nm(fn)], [lab(t.month, t.day), nm(tn)]]));
    cmp.appendChild(cmpBlock('after', [[lab(f.month, f.day), nm(swapN(fn, me, t.name))], [lab(t.month, t.day), nm(swapN(tn, t.name, me))]]));
    w.appendChild(cmp);
    w.appendChild(el('div', 'cap', '상대가 수락하기 전까지는 지금 당번이 그대로예요.'));
    var oo = myPendingOn(f, true).length;
    if (oo) w.appendChild(el('div', 'card cap', '이 당번으로 올린 공개 요청 ' + oo + '건은 이 요청을 보내면 취소돼요.'));
    var row = el('div', 'row');
    var go = btn('btn pri', '요청 보내기', sendPersonal); go.disabled = flow.busy || isLocked(f.month) || isLocked(t.month);
    row.appendChild(btn('btn', '취소', closeFlow)); row.appendChild(go); w.appendChild(row);
  }
  function flowDone(w) {
    var r = flow.result;
    w.appendChild(el('h2', '', r.title));
    w.appendChild(el('div', '', r.body));
    w.appendChild(el('div', 'cap', '상대가 알아차리도록 카톡으로도 알려 주세요.'));
    w.appendChild(el('pre', 'say', r.nudge));
    w.appendChild(btn('btn pri', '카카오톡으로 보내기', function () { shareKakao(r.nudge, r.card); }));
    w.appendChild(btn('btn', '문구만 복사', function () { copyText(r.nudge); }));
    w.appendChild(btn('btn out', '확인', function () { tab = 'swap'; exTab = 'out'; closeFlow(); }));
  }
  function sendPersonal() {
    var f = flow.from, t = flow.target;
    if (isLocked(f.month) || isLocked(t.month)) { toast('마감된 달의 당번은 교환할 수 없어요.'); return; }
    var r = { month: f.month, toMonth: t.month, fromDay: f.day, fromJ: f.j, fromName: me, toDay: t.day, toJ: t.j, toName: t.name };
    if (requests.some(function (x) { return x.status === 'pending' && x.fromName === me && sameSlots(x, r); })) { toast('같은 요청이 이미 대기 중이에요.'); return; }
    flow.busy = true; renderFlow();
    var oldOpen = myPendingOn(f, true);
    API.createRequest(r).then(function () { return cancelAll(oldOpen); }).then(function () {
      flow.busy = false; flow.step = 'done';
      if (window.DutyFx) DutyFx.ok(); flow.result = { title: '요청을 보냈어요', body: t.name + ' 님이 앱에서 수락하면 바로 바뀌어요.' + (oldOpen.length ? ' 이 당번의 공개 요청 ' + oldOpen.length + '건은 취소했어요.' : ''), nudge: nudgeFor('p', r), card: cardFor('p', r) };
      renderFlow();
    }).catch(function () { flow.busy = false; renderFlow(); toast('요청을 보내지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }
  function sendOpen() {
    var f = flow.from; if (!ocReady() || isLocked(f.month)) return;
    var r = { month: f.month, fromDay: f.day, fromJ: f.j, fromName: me, cond: ocCond() };
    flow.busy = true; renderFlow();
    var oldAll = myPendingOn(f, false);
    API.createOpenRequest(r).then(function () { return cancelAll(oldAll); }).then(function () {
      flow.busy = false; flow.step = 'done';
      flow.result = { title: '찾는 중이에요', body: '조건에 맞는 분이 앱에서 수락하면 바로 바뀌어요.' + (oldAll.length ? ' 이 당번의 기존 요청 ' + oldAll.length + '건은 취소했어요.' : ''), nudge: nudgeFor('open', r), card: cardFor('open', r) };
      renderFlow();
    }).catch(function () { flow.busy = false; renderFlow(); toast('올리지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // ---------- 이벤트 ----------
  $('enter').addEventListener('click', function () {
    var v = $('pin').value.trim();
    if (!v) { $('gateMsg').textContent = '암호를 입력해 주세요.'; return; }
    $('gateMsg').textContent = ''; connect(v);
  });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
  $('search').addEventListener('input', function () { renderNames($('search').value.trim()); });

  var started = false;
  window.dutyApiReady.then(function (api) {
    started = true; API = api;
    if (pin) connect(pin); else show('gate');
  }).catch(function () { started = true; show('err'); });
  setTimeout(function () { if (!started) show('err'); }, 12000);
})();
</script>
