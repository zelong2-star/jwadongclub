<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F6F7F9">
<title>좌동클럽 당번표</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#205BDF;--blue-soft:#EAF0FD;--bg:#F6F7F9;--ink:#191F28;--sub:#5B6572;--line:#E5E8EB;--gray:#EEF0F3;--red:#E5484D;--green:#12A150;--amber:#FFF4D6}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg)}
button,input{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}button:disabled{cursor:default}
.hide,[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:24px 20px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:20px;padding:20px}
h1{margin:0;font-size:22px;font-weight:800}
h2{margin:0;font-size:20px;font-weight:800;line-height:1.35}
.cap{font-size:14px;color:var(--sub)}
.lead{font-size:17px;font-weight:700}
.err{color:var(--red);font-size:15px;font-weight:600}
.btn{width:100%;min-height:54px;padding:0 16px;border:0;border-radius:14px;background:var(--gray);color:#333D4B;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--blue);color:#fff}
.btn.wht{background:#fff;color:var(--blue)}
.btn.out{background:#fff;border:1.5px solid var(--line)}
.btn.sm{width:auto;min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45}
.btn svg{flex:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.field{width:100%;min-height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;background:#fff}
.field:focus{border-color:var(--blue);outline:0}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.names .btn{font-size:16px;padding:0 4px}
.hero{background:var(--blue);color:#fff;border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.dday{background:#fff;color:var(--blue);font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.stats{display:flex;gap:12px}
.stat{flex:1;border:0;text-align:left;background:#fff;border-radius:20px;padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:800;margin-top:2px}
.stat .cap{display:block}
.list>.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0;padding-bottom:0}.list>.it:first-child{padding-top:0}
.it .d{font-size:17px;font-weight:700}.it .n{font-size:15px;color:var(--sub)}
.it .me{color:var(--blue);font-weight:800}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gray);color:var(--sub)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.red{background:#FDECEC;color:var(--red)}.tag.green{background:#E3F6EB;color:var(--green)}
.seg{display:flex;background:var(--gray);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-size:16px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mnav{display:flex;align-items:center;justify-content:space-between}
.mnav .t{font-size:20px;font-weight:800}
.mnav button{width:48px;height:48px;border:0;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.mnav button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;font-size:14px;font-weight:700;color:var(--sub);padding:4px 0}
.cal .h.we{color:var(--red)}
.cal .c{min-height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;font-weight:600;padding:0}
.cal .c.has{background:var(--gray)}.cal .c.mine{background:var(--blue-soft);color:var(--blue);font-weight:800}
.cal .c.on{outline:2px solid var(--blue)}.cal .c.we{color:var(--red)}.cal .c.mine.we{color:var(--blue)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%;background:#B0B8C1}.dots i.m{background:var(--blue)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--gray);padding-bottom:env(safe-area-inset-bottom)}
nav.bar .in{max-width:480px;margin:0 auto;display:flex;height:72px}
nav.bar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:#6B7684;position:relative}
nav.bar button[aria-current="page"]{color:var(--blue);font-weight:800}
.dotb{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
#toast{position:fixed;left:16px;right:16px;bottom:88px;z-index:40;max-width:448px;margin:0 auto;background:#191F28;color:#fff;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#flow{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
#flow .wrap{padding-bottom:40px}
.back{align-self:flex-start;min-height:44px;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--sub);padding:0;display:flex;align-items:center;gap:4px}
.opt{width:100%;text-align:left;border:0;border-radius:20px;background:#fff;padding:20px;display:flex;flex-direction:column;gap:4px}
.opt b{font-size:18px;font-weight:800}.opt span{font-size:15px;color:var(--sub)}
.tog{min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:600;padding:0 4px}
.tog[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.tog:disabled{opacity:.4}
.dowrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .blk{border-radius:16px;padding:14px 16px}
.cmp .now{background:var(--gray)}.cmp .after{background:var(--blue-soft)}
.cmp .k{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:6px}.cmp .after .k{color:var(--blue)}
.cmp .ln{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:2px 0}
.cmp .ln b{font-weight:800}
pre.say{margin:0;padding:14px;border-radius:14px;background:var(--gray);font-family:inherit;font-size:15px;line-height:1.7;white-space:pre-wrap;user-select:text}
.btn:focus-visible,.tog:focus-visible,.stat:focus-visible,.opt:focus-visible,.seg button:focus-visible,.cal .c:focus-visible,nav.bar button:focus-visible,.back:focus-visible,.mnav button:focus-visible{outline:3px solid #FF9F1C;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.btn,.tog,.opt,.stat{transition:transform .1s}.btn:active:not(:disabled),.opt:active,.stat:active{transform:scale(.98)}}
</style>

<body>
<div class="wrap" id="boot">
  <section id="wait" class="card">불러오는 중이에요…</section>

  <section id="gate" class="hide" aria-label="클럽 암호">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h1>좌동클럽 당번표</h1>
      <div class="lead">클럽 암호를 입력해 주세요</div>
      <div class="cap">단톡방에 공지된 암호예요. 한 번만 입력하면 이 폰에 기억돼요.</div>
      <label class="cap" for="pin">클럽 암호</label>
      <input class="field" id="pin" type="password" autocomplete="off">
      <div class="err" id="gateMsg" role="alert"></div>
      <button class="btn pri" id="enter">들어가기</button>
    </div>
  </section>

  <section id="picker" class="hide" aria-label="이름 선택">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h1>내 이름을 골라 주세요</h1>
      <div class="cap">한 번만 고르면 이 폰에 기억돼요. 설정에서 언제든 바꿀 수 있어요.</div>
      <label class="cap" for="search">이름 검색</label>
      <input class="field" id="search" type="text" autocomplete="off">
      <div class="names" id="names"></div>
    </div>
  </section>

  <div class="card hide" id="err">연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>
</div>

<section id="app" class="hide">
  <main class="wrap" id="main"></main>
  <nav class="bar" aria-label="메뉴"><div class="in" id="navin"></div></nav>
  <div id="flow" class="hide" role="dialog" aria-modal="true" aria-label="당번 교환"></div>
  <div id="toast" role="status" aria-live="polite" class="hide"></div>
</section>
<script>
(function () {
  'use strict';
  var C = window.DutyCore, DOW = C.DOW;
  var API = null, pin = null, me = null;
  var months = {}, requests = [], logs = [], keys = [], cur = null;
  var tab = 'home', sv = 'list', selDay = null, exTab = 'in', flow = null;
  var unsubs = [], connected = false, toastT = 0;
  var PIN_KEY = 'jwadong-pin-v1', ME_KEY = 'jwadong-me-v1', VIEW_KEY = 'jwadong-view-v1';
  var URL_APP = 'https://zelong2-star.github.io/jwadongclub/duty/';
  var KAKAO_KEY = 'dc69bf31ed2b2b673a737561a98602c4', KAKAO_SDK = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';
  var REASON = { locked: '이 달은 교환이 마감됐어요.', expired: '당번 하루 전까지만 가능한 요청이에요. 이미 지났어요.', past: '이미 지난 날짜는 바꿀 수 없어요.', self: '내가 올린 요청이에요.', cond: '조건에 맞지 않는 날이에요.', stale: '그 사이 당번이 바뀌어서 처리하지 못했어요.', dup: '이미 같은 날 당번이라 바꿀 수 없어요.', done: '이미 다른 분이 수락했거나 취소된 요청이에요.', gone: '요청이 사라졌어요.' };
  var STATUS_KO = { pending: '답을 기다리는 중', accepted: '수락됨 (반영 완료)', declined: '거절됨', cancelled: '취소함', stale: '당번이 바뀌어 처리되지 않음' };
  try { pin = localStorage.getItem(PIN_KEY); me = localStorage.getItem(ME_KEY); var v = localStorage.getItem(VIEW_KEY); if (v === 'cal' || v === 'list') sv = v; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function btn(cls, text, fn) { var b = el('button', cls, text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function show(id) { ['wait', 'gate', 'picker', 'err'].forEach(function (s) { $(s).classList.toggle('hide', s !== id); }); $('boot').classList.toggle('hide', id === 'app'); $('app').classList.toggle('hide', id !== 'app'); }
  function toast(t) { var n = $('toast'); n.textContent = t; n.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(function () { n.classList.add('hide'); }, 4500); }
  function toggle(arr, v) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
  function icon(d) { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', '22'); s.setAttribute('height', '22'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true'); var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.appendChild(p); return s; }
  var I = { swap: 'M7 7h12l-3-3M17 17H5l3 3', home: 'M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z', cal: 'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 3v4M16 3v4M4 10h16', gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1', l: 'M15 6l-6 6 6 6', r: 'M9 6l6 6-6 6' };

  function duties(k) { var m = months[k]; return (m && m.duties) || {}; }
  function isLocked(k) { return !!(months[k] && months[k].locked); }
  function dmAll() { var o = {}; keys.forEach(function (k) { o[k] = duties(k); }); return o; }
  function lab(k, d) { return C.label(k, d); }
  function longLab(k, d) { var p = C.parseKey(k); return p[1] + '월 ' + d + '일 ' + C.dowOf(p[0], p[1], d) + '요일'; }
  function sortedDays(k) { return Object.keys(duties(k)).map(Number).sort(function (a, b) { return a - b; }); }
  function slotOf(k, d, j) { return { month: k, day: d, j: j, name: (duties(k)[d] || [])[j] }; }
  function others(k, d) { return (duties(k)[d] || []).filter(function (n) { return n && n !== me; }); }
  function namesOf(k, d) { return (duties(k)[d] || []).filter(Boolean); }
  function allNames() {
    var set = {};
    keys.forEach(function (k) { var ds = duties(k); Object.keys(ds).forEach(function (d) { (ds[d] || []).forEach(function (n) { if (n) set[n] = 1; }); }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
  }
  // 내 앞으로의 당번 (지난 날 제외), 날짜순
  function myUpcoming() {
    var out = [];
    keys.forEach(function (k) { sortedDays(k).forEach(function (d) { var ds = duties(k)[d] || []; var j = ds.indexOf(me); if (j >= 0 && !C.isPast(k, d)) out.push({ month: k, day: d, j: j, name: me }); }); });
    return out;
  }
  function dayDiff(k, d) { var p = C.parseKey(k), n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate()); return Math.round((new Date(p[0], p[1] - 1, d) - t) / 864e5); }
  function sameSlots(a, b) { return a.month === b.month && (a.toMonth || a.month) === (b.toMonth || b.month) && a.fromDay === b.fromDay && a.fromJ === b.fromJ && a.toDay === b.toDay && a.toJ === b.toJ; }
  function reqValid(r) {
    var tm = r.toMonth || r.month;
    var res = C.swapX(dmAll(), { month: r.month, day: r.fromDay, j: r.fromJ, name: r.fromName }, { month: tm, day: r.toDay, j: r.toJ, name: r.toName });
    return res.ok && !C.isPast(r.month, r.fromDay) && !C.isPast(tm, r.toDay);
  }
  // 내 당번(from)과 상대 칸(t)을 맞바꿀 수 있는지
  function canPair(from, t) {
    if (!t.name || t.name === me) return false;
    if (C.isPast(t.month, t.day) || isLocked(t.month) || isLocked(from.month)) return false;
    if (t.month === from.month && t.day === from.day) return false;
    if (namesOf(t.month, t.day).indexOf(me) >= 0) return false;
    if (namesOf(from.month, from.day).indexOf(t.name) >= 0) return false;
    return C.swapX(dmAll(), from, t).ok;
  }
  function inboxList() { return requests.filter(function (r) { return r.type !== 'open' && r.status === 'pending' && r.toName === me && reqValid(r); }); }
  function openList() {
    var out = [];
    requests.forEach(function (r) {
      if (r.type !== 'open' || r.status !== 'pending' || r.fromName === me || !months[r.month] || C.expired(r.month, r.fromDay)) return;
      var opts = C.myOptions(dmAll(), r, me, isLocked);
      if (opts.length) out.push({ r: r, opts: opts });
    });
    return out;
  }
  function nudgeFor(kind, r) {
    if (kind === 'open') return '[교환요청(공개)] ' + me + '님이 ' + lab(r.month, r.fromDay) + ' 당번을 바꿀 분을 찾아요. 조건: ' + C.condText(r.cond) + '\n당번표 앱의 "교환" 메뉴에서 수락해 주세요.\n' + URL_APP;
    return '[교환요청] ' + r.toName + '님, ' + lab(r.month, r.fromDay) + ' ' + me + ' ↔ ' + lab(r.toMonth, r.toDay) + ' ' + r.toName + ' 교환을 요청했어요. 당번표 앱의 "교환" 메뉴에서 수락해 주세요.\n' + URL_APP;
  }
  function copyText(t) {
    function fb() { toast('복사 권한이 없어요. 글을 길게 눌러 직접 복사해 주세요.'); }
    try { navigator.clipboard.writeText(t).then(function () { toast('복사했어요. 카톡에 붙여넣어 주세요.'); }, fb); } catch (e) { fb(); }
  }

  // 카카오톡 공유: 실패하면 공유 시트 → 문구 복사 순서로 대신해요
  function loadKakao() {
    return new Promise(function (res, rej) {
      if (window.Kakao) return res(window.Kakao);
      var s = document.createElement('script'); s.src = KAKAO_SDK; s.async = true;
      s.onload = function () { window.Kakao ? res(window.Kakao) : rej(new Error('nokakao')); };
      s.onerror = function () { rej(new Error('load')); };
      document.head.appendChild(s);
      setTimeout(function () { rej(new Error('timeout')); }, 6000);
    });
  }
  function shareKakao(text) {
    function fallback() {
      if (navigator.share) { navigator.share({ text: text }).catch(function () { copyText(text); }); toast('카톡 연결이 안 돼서 공유 창을 열었어요.'); }
      else { copyText(text); }
    }
    loadKakao().then(function (K) {
      if (!K.isInitialized()) K.init(KAKAO_KEY);
      var link = { mobileWebUrl: URL_APP, webUrl: URL_APP };
      K.Share.sendDefault({ objectType: 'text', text: text.replace(/\n?https?:\/\/\S+/g, '').slice(0, 200), link: link, buttonTitle: '수락하러 가기' });
    }).catch(fallback);
  }

  // ---------- 연결 ----------
  function connect(p) {
    show('wait');
    unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = [];
    connected = false;
    var first = true;
    API.setPin(p).then(function () {
      unsubs.push(API.subscribeMonths(function (ms) {
        months = ms; keys = Object.keys(ms).sort();
        if (first) {
          first = false;
          if (!keys.length) {
            unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = [];
            pin = null; save(PIN_KEY, '');
            $('gateMsg').textContent = '암호가 맞지 않거나, 아직 올라온 당번표가 없어요. 총무에게 확인해 주세요.';
            show('gate'); return;
          }
          pin = p; save(PIN_KEY, p);
          var n = new Date(), nk = n.getFullYear() + '-' + C.pad(n.getMonth() + 1);
          cur = keys.indexOf(nk) >= 0 ? nk : keys[keys.length - 1];
          connected = true;
          unsubs.push(API.subscribeRequests(function (rs) { requests = rs; if (connected) renderAll(); }, onErr));

  function flowHow(w) {
    var f = flow.from;
    w.appendChild(el('h2', '', '어떻게 바꿀까요?'));
    w.appendChild(el('div', 'cap', '바꾸려는 당번: ' + longLab(f.month, f.day)));
    var a = btn('opt', '', function () { flow.step = 'who'; flow.tm = f.month; renderFlow(); });
    a.appendChild(el('b', '', '특정 회원에게 요청')); a.appendChild(el('span', '', '바꾸고 싶은 분을 직접 골라 요청해요'));
    var b = btn('opt', '', function () { flow.step = 'cond'; renderFlow(); });
    b.appendChild(el('b', '', '교환 가능한 회원 찾기')); b.appendChild(el('span', '', '내가 가능한 날을 알려 주면, 맞는 분이 수락해요'));
    w.appendChild(a); w.appendChild(b);
  }
  function flowWho(w) {
    var f = flow.from;
    w.appendChild(el('h2', '', '누구와 바꿀까요?'));
    w.appendChild(el('div', 'cap', longLab(f.month, f.day) + ' 당번을 넘기고, 고른 분의 당번을 받아요.'));
    var i = keys.indexOf(flow.tm), p = C.parseKey(flow.tm);
    var n = el('div', 'mnav');
    var pb = btn('', '', function () { flow.tm = keys[i - 1]; renderFlow(); }); pb.appendChild(icon(I.l)); pb.disabled = i <= 0; pb.setAttribute('aria-label', '이전 달');
    var nb = btn('', '', function () { flow.tm = keys[i + 1]; renderFlow(); }); nb.appendChild(icon(I.r)); nb.disabled = i >= keys.length - 1; nb.setAttribute('aria-label', '다음 달');
    n.appendChild(pb); n.appendChild(el('div', 't', p[1] + '월')); n.appendChild(nb); w.appendChild(n);
    if (isLocked(flow.tm)) { w.appendChild(el('div', 'card cap', '이 달은 교환이 마감됐어요.')); return; }
    var card = el('div', 'card'), list = el('div', 'list'), cnt = 0;
    sortedDays(flow.tm).forEach(function (d) {
      if (C.isPast(flow.tm, d)) return;
      var ds = duties(flow.tm)[d] || [];
      if (flow.tm === f.month && d === f.day) return;
      var it = el('div', 'it'); it.style.flexDirection = 'column'; it.style.alignItems = 'stretch';
      var hasMe = ds.indexOf(me) >= 0;
      it.appendChild(el('div', 'd', lab(flow.tm, d)));
      var row = el('div', 'row'); row.style.flexWrap = 'wrap';
      ds.forEach(function (name, j) {
        if (!name || name === me) return;
        var t = slotOf(flow.tm, d, j), ok = canPair(f, t);
        var b = btn('tog', name, function () { flow.target = t; flow.step = 'confirm'; renderFlow(); });
        b.style.flex = '1 1 40%'; b.disabled = !ok; b.setAttribute('aria-label', lab(flow.tm, d) + ' ' + name + ' 님과 교환');
        if (ok) cnt++; row.appendChild(b);
      });
      if (hasMe) it.appendChild(el('div', 'cap', '내가 이미 당번인 날이에요.')); else if (row.children.length) it.appendChild(row); else return;
      list.appendChild(it);
    });
    if (!list.children.length) list.appendChild(el('div', 'cap', '이 달에는 바꿀 수 있는 당번이 없어요. 다른 달을 눌러 보세요.'));
    card.appendChild(list); w.appendChild(card);
  }
  function ocCond() { var o = flow.oc; return { mode: o.mode, dows: o.mode === 'dow' ? o.dows.slice().sort() : [], dates: o.mode === 'dow' ? [] : o.dates.slice().sort() }; }
  function ocReady() { var o = flow.oc; return o.mode === 'except' || (o.mode === 'dow' ? o.dows.length > 0 : o.dates.length > 0); }
  function flowCond(w) {
    var f = flow.from, o = flow.oc;
    w.appendChild(el('h2', '', '언제 당번을 서면 괜찮으세요?'));
    w.appendChild(el('div', 'cap', longLab(f.month, f.day) + ' 당번을 넘기고, 아래 조건의 날과 바꿔요.'));
    var sg = el('div', 'seg'); sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', '조건 방식');
    [['dow', '요일로'], ['dates', '날짜로'], ['except', '이 날만 빼고']].forEach(function (x) { var b = btn('', x[1], function () { o.mode = x[0]; renderFlow(); }); b.setAttribute('aria-pressed', o.mode === x[0] ? 'true' : 'false'); sg.appendChild(b); });
    w.appendChild(sg);
    var card = el('div', 'card'); card.style.display = 'flex'; card.style.flexDirection = 'column'; card.style.gap = '12px';
    if (o.mode === 'dow') {
      card.appendChild(el('div', 'lead', '가능한 요일 (여러 개 선택)'));
      var dr = el('div', 'dowrow');
      DOW.forEach(function (nm, i) { var b = btn('tog', nm, function () { toggle(o.dows, i); renderFlow(); }); b.setAttribute('aria-pressed', o.dows.indexOf(i) >= 0 ? 'true' : 'false'); dr.appendChild(b); });
      card.appendChild(dr);
    } else {
      card.appendChild(el('div', 'lead', o.mode === 'dates' ? '가능한 날짜 (여러 개 선택)' : '안 되는 날짜 (여러 개 선택)'));
      var dd = el('div', 'dates');
      C_days().forEach(function (x) {
        if (x.k === f.month && x.d === f.day) return;
        var key = C.dkey(x.k, x.d), b = btn('tog', lab(x.k, x.d), function () { toggle(o.dates, key); renderFlow(); });
        b.setAttribute('aria-pressed', o.dates.indexOf(key) >= 0 ? 'true' : 'false'); dd.appendChild(b);
      });
      if (!dd.children.length) dd.appendChild(el('div', 'cap', '선택할 수 있는 날짜가 없어요.'));
      card.appendChild(dd);
    }
    w.appendChild(card);
    var sm = el('div', 'card cap', ocReady() ? '조건: ' + C.condText(ocCond()) + ' · 맞는 분이 앱에서 수락하면 바로 바뀌어요.' : '위에서 조건을 골라 주세요.'); w.appendChild(sm);
    var go = btn('btn pri', '교환 가능한 회원 찾기', sendOpen); go.disabled = !ocReady() || isLocked(f.month) || flow.busy; w.appendChild(go);
  }
  function C_days() { var out = []; keys.forEach(function (k) { sortedDays(k).forEach(function (d) { if (!C.expired(k, d)) out.push({ k: k, d: d }); }); }); return out; }
  function flowConfirm(w) {
    var f = flow.from, t = flow.target;
    w.appendChild(el('h2', '', t.name + ' 님께 이렇게 요청할까요?'));
    var cmp = el('div', 'cmp');
    var fn = namesOf(f.month, f.day), tn = namesOf(t.month, t.day);
    var swapN = function (arr, a, b) { return arr.map(function (x) { return x === a ? b : x; }); };
    function nm(arr) { return arr.map(function (x) { return x === me ? '나' : x; }).join(' · '); }
    cmp.appendChild(cmpBlock('now', [[lab(f.month, f.day), nm(fn)], [lab(t.month, t.day), nm(tn)]]));
    cmp.appendChild(cmpBlock('after', [[lab(f.month, f.day), nm(swapN(fn, me, t.name))], [lab(t.month, t.day), nm(swapN(tn, t.name, me))]]));
    w.appendChild(cmp);
    w.appendChild(el('div', 'cap', '상대가 수락하기 전까지는 지금 당번이 그대로예요.'));
    var row = el('div', 'row');
    var go = btn('btn pri', '요청 보내기', sendPersonal); go.disabled = flow.busy || isLocked(f.month) || isLocked(t.month);
    row.appendChild(btn('btn', '취소', closeFlow)); row.appendChild(go); w.appendChild(row);
  }
  function flowDone(w) {
    var r = flow.result;
    w.appendChild(el('h2', '', r.title));
    w.appendChild(el('div', '', r.body));
    w.appendChild(el('div', 'cap', '상대가 알아차리도록 카톡으로도 알려 주세요.'));
    w.appendChild(el('pre', 'say', r.nudge));
    w.appendChild(btn('btn pri', '카카오톡으로 보내기', function () { shareKakao(r.nudge); }));
    w.appendChild(btn('btn', '문구만 복사', function () { copyText(r.nudge); }));
    w.appendChild(btn('btn out', '확인', function () { tab = 'swap'; exTab = 'out'; closeFlow(); }));
  }
  function sendPersonal() {
    var f = flow.from, t = flow.target;
    if (isLocked(f.month) || isLocked(t.month)) { toast('마감된 달의 당번은 교환할 수 없어요.'); return; }
    var r = { month: f.month, toMonth: t.month, fromDay: f.day, fromJ: f.j, fromName: me, toDay: t.day, toJ: t.j, toName: t.name };
    if (requests.some(function (x) { return x.status === 'pending' && x.fromName === me && sameSlots(x, r); })) { toast('같은 요청이 이미 대기 중이에요.'); return; }
    flow.busy = true; renderFlow();
    API.createRequest(r).then(function () {
      flow.busy = false; flow.step = 'done';
      flow.result = { title: '요청을 보냈어요', body: t.name + ' 님이 앱에서 수락하면 바로 바뀌어요.', nudge: nudgeFor('p', r) };
      renderFlow();
    }).catch(function () { flow.busy = false; renderFlow(); toast('요청을 보내지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }
  function sendOpen() {
    var f = flow.from; if (!ocReady() || isLocked(f.month)) return;
    if (requests.some(function (x) { return x.type === 'open' && x.status === 'pending' && x.fromName === me && x.month === f.month && x.fromDay === f.day && x.fromJ === f.j; })) { toast('이 당번의 공개 요청이 이미 올라가 있어요. 먼저 취소해 주세요.'); return; }
    var r = { month: f.month, fromDay: f.day, fromJ: f.j, fromName: me, cond: ocCond() };
    flow.busy = true; renderFlow();
    API.createOpenRequest(r).then(function () {
      flow.busy = false; flow.step = 'done';
      flow.result = { title: '찾는 중이에요', body: '조건에 맞는 분이 앱에서 수락하면 바로 바뀌어요.', nudge: nudgeFor('open', r) };
      renderFlow();
    }).catch(function () { flow.busy = false; renderFlow(); toast('올리지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // ---------- 이벤트 ----------
  $('enter').addEventListener('click', function () {
    var v = $('pin').value.trim();
    if (!v) { $('gateMsg').textContent = '암호를 입력해 주세요.'; return; }
    $('gateMsg').textContent = ''; connect(v);
  });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
  $('search').addEventListener('input', function () { renderNames($('search').value.trim()); });

  var started = false;
  window.dutyApiReady.then(function (api) {
    started = true; API = api;
    if (pin) connect(pin); else show('gate');
  }).catch(function () { started = true; show('err'); });
  setTimeout(function () { if (!started) show('err'); }, 12000);
})();
</script>
</body>
</html>
