<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점제 발음 샘플</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d2433;--card:#fff;--ac:#0C50A1;--mu:#6b7385}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--fg:#eef0f4;--card:#202734;--ac:#6aa7ff;--mu:#9aa3b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181f;--fg:#eef0f4;--card:#202734;--ac:#6aa7ff;--mu:#9aa3b5;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;margin:0;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mu);margin:0 0 14px;font-size:14px}
.r{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.r b{flex:1;min-width:0}.r small{display:block;color:var(--mu);font-weight:400;font-size:12px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700}
</style>
<h1>점제 발음 샘플</h1><p>▶ 누르면 이 기기의 한국어 음성으로 읽어요. 마음에 드는 번호를 알려 주세요.</p>
<div id="l"></div>
<script>
const V=[["예약 완료. 21점제입니다.","숫자 그대로(v279)"],["예약 완료. 이십일 점제입니다.","현재 적용(v280)"],["예약 완료. 이십일점 제입니다.","'이십일점 제' 띄어쓰기"],["예약 완료. 이십일점제 입니다.","'이십일점제 입니다'"],["예약 완료. 스물한 점제입니다.","고유어 숫자"],["예약 완료. 이십일 점 제입니다.","점·제 분리"]];
const l=document.getElementById('l');
V.forEach((v,i)=>{const d=document.createElement('div');d.className='r';d.innerHTML='<b>'+(i+1)+'번 · '+v[0]+'<small>'+v[1]+'</small></b><button>▶</button>';
d.querySelector('button').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v[0]);u.lang='ko-KR';const k=speechSynthesis.getVoices().find(x=>/^ko/i.test(x.lang));if(k)u.voice=k;speechSynthesis.speak(u)}catch(e){}};l.appendChild(d)});
</script>
