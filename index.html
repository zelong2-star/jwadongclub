<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c50a1">
<meta name="description" content="좌동배드민턴클럽 개인 경기 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLAY LOG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{box-sizing:border-box}body{margin:0;padding:0;background:#eef3f9}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>PLAY. LOG. PLAY.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout concept: 좌동클럽 리그전 앱과 같은 체육관 스코어보드. 초록 티켓이 오늘을 요약하고, 아래로 날짜별 경기 카드가 쌓인다. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#0f1411; --muted:#58645d; --line:#d9dfdb;
  --court:#0a7a43; --on-court:#ffffff; --court-soft:#e5f2ea; --court-rule:#8ec7a8;
  --navy:#01023c; --win:#ffba43; --win-ink:#4a2c00; --danger:#b3412f; --lose:#3f74c8; --seg:#e2e8e4;
  --title:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Barlow Condensed','Noto Sans KR',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f0c; --surface:#121a15; --ink:#eef3ef; --muted:#9aa89f; --line:#233028;
  --court:#2fc27a; --on-court:#04170d; --court-soft:#15271d; --court-rule:#2c6b49;
  --navy:#dfe3ff; --danger:#ef8e7d; --lose:#7ea6ea; --seg:#1a2520; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f0c; --surface:#121a15; --ink:#eef3ef; --muted:#9aa89f; --line:#233028;
  --court:#2fc27a; --on-court:#04170d; --court-soft:#15271d; --court-rule:#2c6b49;
  --navy:#dfe3ff; --danger:#ef8e7d; --lose:#7ea6ea; --seg:#1a2520; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-block:12px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리 */
.mast{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{display:block;height:40px;width:40px;object-fit:contain;padding:3px;background:#fff;border:1px solid var(--line);border-radius:11px;flex:none}
.mast h1{margin:0;font:italic 800 clamp(22px,7.2vw,30px)/1 'Barlow Condensed','Noto Sans KR',sans-serif;letter-spacing:.02em;white-space:nowrap}
.mast h1 em{font-style:inherit;color:var(--court)}
.mast .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.mast>div{min-width:0}

/* 티켓 */
.ticket{position:relative;margin:8px 0 12px;border-radius:20px;background:var(--court);color:var(--on-court);display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:14px;padding:12px 84px 12px 16px;min-height:96px}
.ticket .k{text-align:center;line-height:1;padding-right:14px;border-right:2px dashed color-mix(in srgb,var(--on-court) 38%,transparent)}
.ticket .k small{display:block;font:700 11px/1.2 var(--body);opacity:.88;margin-bottom:4px}
.ticket .k b{font:700 48px/.9 var(--num)}
.ticket .k i{font:600 13px var(--body);font-style:normal;opacity:.9}
.ticket .d{min-width:0}
.ticket .wl{font:700 34px/1 var(--num);letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.ticket .wl span small{font:700 14px var(--body);margin-left:2px}
.ticket .wl .w{color:#ffd24a}
.ticket .d p{margin:4px 0 0;font-size:13px;opacity:.92;overflow-wrap:anywhere}
.ticket::before,.ticket::after{content:'';position:absolute;right:68px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.mascot{position:absolute;right:8px;bottom:6px;width:62px;height:80px;pointer-events:none}
.mascot img,.mascot svg{display:block;max-width:none}
.mascot .mc-body{position:absolute;right:2px;bottom:0;width:35px;height:70px;transform-origin:50% 100%;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.mascot .mc-bd,.mascot .mc-rk,.mascot svg{position:absolute;left:0;top:0;width:100%;height:100%}
.mascot .mc-rk{transform-origin:25% 35%}
.mascot .mc-sh{position:absolute;left:0;top:0;width:20px;height:20px;z-index:1;transform:translate(27px,-7px)}
.mascot .mw{opacity:0}
.mascot .shadow{position:absolute;right:6px;width:31px;bottom:-4px;height:6px;border-radius:50%;background:rgb(0 0 0 / .22)}
@media all{   /* 마스코트 동작은 절전·애니메이션 줄이기 설정에서도 보이게 */
  /* 통통 (셔틀콕 띄우기) */
  .mascot[data-a=hop] .mc-body{animation:hop 1.2s ease-in-out}
  .mascot[data-a=hop] .mc-rk{animation:rkHop 1.2s ease-in-out}
  .mascot[data-a=hop] .shadow{animation:shHop 1.2s ease-in-out}
  .mascot[data-a=hop] .mc-sh{animation:shtHop 1.2s ease-in-out}
  /* 스매시 */
  .mascot[data-a=smash] .mc-body{animation:bdSm2 2.5s ease-in-out}
  .mascot[data-a=smash] .mc-rk{animation:rkSm2 2.5s ease-in-out}
  .mascot[data-a=smash] .mc-sh{animation:shSm2 2.5s linear}
  .mascot[data-a=smash] .mo{animation:moSm2 2.5s steps(1,end)}.mascot[data-a=smash] .mw{animation:mwSm2 2.5s steps(1,end)}
  /* 드라이브 */
  .mascot[data-a=drive] .mc-body{animation:bdDr 3s ease-in-out}
  .mascot[data-a=drive] .mc-rk{animation:rkDr 3s ease-in-out}
  .mascot[data-a=drive] .mc-sh{animation:shDr 3s linear}
  /* 언더 (아래에서 걷어 올리기) */
  .mascot[data-a=under] .mc-body{animation:bdUn 2.6s ease-in-out}
  .mascot[data-a=under] .mc-rk{animation:rkUn 2.6s ease-in-out}
  .mascot[data-a=under] .mc-sh{animation:shUn 2.6s linear}
  .mascot[data-a=under] .mo{animation:moUn 2.6s steps(1,end)}.mascot[data-a=under] .mw{animation:mwUn 2.6s steps(1,end)}
}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-16px) scale(.96,1.05)}48%{transform:translateY(0) scale(1.07,.92)}62%{transform:translateY(-7px) scale(.98,1.02)}78%{transform:translateY(0) scale(1.03,.97)}}
@keyframes rkHop{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg)}62%{transform:rotate(-8deg)}}
@keyframes shtHop{0%,10%{transform:translate(27px,-7px) rotate(0)}30%{transform:translate(25px,-30px) rotate(-120deg)}50%{transform:translate(23px,-46px) rotate(-220deg)}74%{transform:translate(27px,-10px) rotate(-340deg)}82%{transform:translate(27px,-14px) rotate(-355deg)}90%,100%{transform:translate(27px,-7px) rotate(-360deg)}}
@keyframes shHop{0%,100%,48%,78%{transform:scale(1);opacity:1}30%{transform:scale(.6);opacity:.5}62%{transform:scale(.8);opacity:.7}}
@keyframes bdSm2{0%,12%{transform:translateY(0) scale(1,1)}22%{transform:translateY(2px) scale(1.06,.94)}34%{transform:translateY(-15px) scale(.97,1.04)}46%{transform:translateY(-12px) rotate(-5deg)}62%{transform:translateY(0) scale(1.05,.95)}74%,100%{transform:translateY(0) scale(1,1)}}
@keyframes rkSm2{0%,14%{transform:rotate(0)}30%{transform:rotate(38deg)}42%{transform:rotate(38deg)}47%{transform:rotate(-48deg)}70%{transform:rotate(-20deg)}88%,100%{transform:rotate(0)}}
@keyframes shSm2{0%{transform:translate(27px,-7px);opacity:1}6%{transform:translate(18px,-40px);opacity:1}14%{transform:translate(10px,-30px);opacity:1}40%{transform:translate(24px,-4px);opacity:1}46%{transform:translate(25px,-3px);opacity:1}62%{transform:translate(-10px,58px);opacity:1}72%{transform:translate(-14px,62px);opacity:0}73%,86%{transform:translate(27px,-30px);opacity:0}96%,100%{transform:translate(27px,-7px);opacity:1}}
@keyframes moSm2{0%{opacity:1}30%{opacity:0}74%,100%{opacity:1}}
@keyframes mwSm2{0%{opacity:0}30%{opacity:1}74%,100%{opacity:0}}
@keyframes bdDr{0%,100%{transform:rotate(0) translateY(0)}8%,86%{transform:rotate(-5deg) translateY(2px) scale(1.02,.96)}14%{transform:rotate(-7deg) translateY(1px) scale(1.02,.96)}40%{transform:rotate(-7deg) translateY(1px) scale(1.02,.96)}66%{transform:rotate(-7deg) translateY(1px) scale(1.02,.96)}}
@keyframes rkDr{0%{transform:rotate(0)}6%,86%{transform:rotate(-78deg)}14%,40%,66%{transform:rotate(-60deg)}12%,38%,64%{transform:rotate(-80deg)}92%,100%{transform:rotate(0)}}
@keyframes shDr{0%{opacity:1;transform:translate(27px,-7px)}4%{opacity:0;transform:translate(27px,-7px)}5%{opacity:0;transform:translate(-38px,24px)}6%{opacity:1;transform:translate(-30px,24px)}12%{opacity:1;transform:translate(-3px,24px)}14%{opacity:1;transform:translate(-3px,24px)}20%{opacity:1;transform:translate(-38px,24px)}21%,32%{opacity:0;transform:translate(-38px,24px)}34%{opacity:1;transform:translate(-30px,24px)}38%{opacity:1;transform:translate(-3px,24px)}40%{opacity:1;transform:translate(-3px,24px)}46%{opacity:1;transform:translate(-38px,24px)}47%,58%{opacity:0;transform:translate(-38px,24px)}60%{opacity:1;transform:translate(-30px,24px)}64%{opacity:1;transform:translate(-3px,24px)}66%{opacity:1;transform:translate(-3px,24px)}72%{opacity:1;transform:translate(-38px,24px)}73%,88%{opacity:0;transform:translate(27px,-30px)}96%,100%{opacity:1;transform:translate(27px,-7px)}}
@keyframes bdUn{0%,8%{transform:rotate(0) translateY(0) scale(1,1)}24%,40%{transform:rotate(6deg) translateY(3px) scale(1.06,.92)}50%{transform:rotate(-4deg) translateY(-4px) scale(.97,1.04)}62%{transform:rotate(-2deg) translateY(0) scale(1,1)}80%,100%{transform:rotate(0) translateY(0) scale(1,1)}}
@keyframes rkUn{0%,8%{transform:rotate(0)}24%,40%{transform:rotate(-150deg)}47%{transform:rotate(-40deg)}54%{transform:rotate(-10deg)}70%,100%{transform:rotate(0)}}
@keyframes shUn{0%{opacity:1;transform:translate(27px,-7px) rotate(0)}5%{opacity:0;transform:translate(27px,-7px)}6%{opacity:0;transform:translate(-26px,-30px) rotate(160deg)}12%{opacity:1;transform:translate(-22px,-24px) rotate(170deg)}40%{opacity:1;transform:translate(12px,30px) rotate(180deg)}44%{opacity:1;transform:translate(13px,30px) rotate(180deg)}58%{opacity:1;transform:translate(-14px,-36px) rotate(150deg)}68%{opacity:1;transform:translate(-30px,-50px) rotate(140deg)}70%,86%{opacity:0;transform:translate(27px,-30px) rotate(0)}96%,100%{opacity:1;transform:translate(27px,-7px) rotate(0)}}
@keyframes moUn{0%{opacity:1}44%{opacity:0}66%,100%{opacity:1}}
@keyframes mwUn{0%{opacity:0}44%{opacity:1}66%,100%{opacity:0}}
@media all{   /* 마스코트 동작은 절전·애니메이션 줄이기 설정에서도 보이게 */
  .mascot[data-a=nod] .mc-body{animation:bdNod .65s ease-out}
  .mascot[data-a=nod] .mc-rk{animation:rkNod .65s ease-out}
  .mascot[data-a=nod] .mc-sh{animation:shNod .65s ease-out}
  .mascot[data-a=nod] .mo{animation:moNod .65s steps(1,end)}.mascot[data-a=nod] .mw{animation:mwNod .65s steps(1,end)}
}
@keyframes bdNod{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(1px) scale(1.07,.92)}55%{transform:translateY(-6px) scale(.97,1.04)}80%{transform:translateY(0) scale(1.02,.98)}}
@keyframes rkNod{0%,100%{transform:rotate(0)}40%{transform:rotate(-22deg)}70%{transform:rotate(6deg)}}
@keyframes shNod{0%,100%{transform:translate(27px,-7px) rotate(0)}50%{transform:translate(25px,-22px) rotate(-120deg)}85%{transform:translate(27px,-9px) rotate(-340deg)}}
@keyframes moNod{0%{opacity:1}25%{opacity:0}80%,100%{opacity:1}}
@keyframes mwNod{0%{opacity:0}25%{opacity:1}80%,100%{opacity:0}}

/* 제목, 점수: 진한 남색 */
.mast h1,.day>summary .dt,.empty h2,.h2,.shd h3{color:var(--navy)}
.g .sc .m,.score input,.st:not(.hl) b,td,.prow .rec strong,.pc b{color:var(--navy)}
td:first-child{color:var(--ink)}
.g.win .sc .m{color:#c9382f}

/* 내 이름 */
.mast>div{flex:1}
.mepill{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:4px;min-height:38px;max-width:40vw;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:700;font-size:13.5px;color:var(--navy);cursor:pointer}
.mepill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mepill svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mepill.noname{color:var(--court-txt);box-shadow:inset 0 0 0 1.5px var(--court-rule)}
textarea{width:100%;min-height:90px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font:12px/1.4 ui-monospace,monospace}
.infobox{padding:12px 14px;border-radius:12px;background:var(--court-soft);font-size:13.5px;line-height:1.55}
.infobox.warn{background:color-mix(in srgb,var(--win) 22%,var(--surface))}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.nudge{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border:1.5px solid var(--win);border-radius:14px;background:color-mix(in srgb,var(--win) 16%,var(--surface));text-align:left;cursor:pointer;color:var(--ink)}
.nudge b{display:block;font-size:14.5px}.nudge small{display:block;font-size:12.5px;color:var(--muted)}.nudge .go{margin-left:auto;font-size:20px;color:var(--muted)}
details.bk{display:block}details.bk>*+*{margin-top:8px}details.bk>summary{padding:6px 0}.btnrow .btn{flex:1 1 140px}

/* 버튼 */
.btn{min-height:44px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--court-soft)}
.btn.primary{background:var(--court);color:var(--on-court);border-color:var(--court)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;font-size:17px;border-radius:16px}
.big svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* 날짜별 목록 */
.day{margin-top:14px}
.day>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 2px;cursor:pointer}
.day>summary::-webkit-details-marker{display:none}
.day>summary .dt{font:400 20px/1.1 var(--title)}
.day>summary .dc{font-size:12px;color:var(--muted)}
.day>summary .pill{padding:0 9px;border-radius:99px;font:600 11.5px/20px var(--body);background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--muted);white-space:nowrap}
.day>summary::after{content:'';flex:1;min-width:20px;height:9px;margin-left:4px;background:linear-gradient(var(--court),var(--court)) 0 0/100% 2px no-repeat,repeating-linear-gradient(135deg,color-mix(in srgb,var(--court) 35%,transparent) 0 1px,transparent 1px 5px)}
.day>summary .chev{order:9;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;transition:transform .15s}
.day[open]>summary .chev{transform:rotate(180deg)}
.games{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:6px}
.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.games>.g:first-child{border-top:0}
.g:hover{background:var(--court-soft)}
.g .res{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 13px/1 var(--body);color:#fff;background:#8a948e}
.g .res.w{background:#d6403a}.g .res.l{background:var(--lose)}
.g .who{min-width:0;line-height:1.35}
.g .who .us{font-size:12.5px;color:var(--muted)}
.g .who .them{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.g .who .them small{font-weight:500;color:var(--muted);font-size:12px;margin-right:4px}
.g .sc{font:700 24px/1 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.g .sc .m{color:var(--ink)}.g .sc .t{color:var(--muted)}
.g.win .sc .m{color:#c9382f}
.g .mode{display:block;font:600 10.5px/1 var(--body);color:var(--muted);text-align:right;margin-top:3px}

/* 빈 상태 */
.empty{margin:16px 0 0;padding:22px 18px;border:1.5px dashed var(--court-rule);border-radius:16px;background:var(--court-soft)}
.empty h2{margin:0 0 6px;font:400 22px/1.2 var(--title)}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}

/* 칩, 세그먼트 */
.fchips{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.fchip{min-height:38px;padding:6px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.14)}

/* 전적 */
.h2{margin:22px 2px 8px;font:400 19px/1.2 var(--title)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.st small{display:block;font-size:11.5px;color:var(--muted)}
.st b{display:block;font:700 30px/1.05 var(--num);font-variant-numeric:tabular-nums}
.st b em{font-style:normal;font-size:16px;font-weight:600;margin-left:1px}
.st.hl{background:var(--court);border-color:var(--court);color:var(--on-court)}
.st.hl small{color:inherit;opacity:.85}
.streak{margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.streak .sb{font:700 22px/1 var(--num);padding:4px 10px;border-radius:99px;background:var(--win);color:var(--win-ink)}
.streak .sb.l{background:var(--lose);color:#fff}
.streak p{margin:0;font-size:13.5px;color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pc small{display:block;font-size:11.5px;color:var(--muted)}
.pc b{display:block;font-size:17px;margin:2px 0;overflow-wrap:anywhere}
.pc span{font:600 15px var(--num);font-variant-numeric:tabular-nums;color:var(--muted)}
.pc.best{border-color:var(--court-rule);background:var(--court-soft)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:center;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{border-bottom:1px solid var(--line);font:600 17px var(--num)}
td:first-child{font:500 14px var(--body);text-align:left;padding-left:14px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.bar{display:inline-block;vertical-align:middle;width:56px;height:6px;border-radius:9px;background:var(--seg);margin-left:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px 0}

/* 사람 */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.plist>.prow:first-child{border-top:0}
.prow:hover{background:var(--court-soft)}
.prow b{font-size:15.5px}
.prow .meta{font-size:12px;color:var(--muted)}
.prow .rec{grid-row:1/3;grid-column:2;text-align:right;align-self:center;line-height:1.15}
.prow .rec strong{display:block;font:700 22px var(--num)}
.prow .rec span{font-size:11.5px;color:var(--muted)}
.rosterbtn{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer}
.rosterbtn:hover{background:var(--court-soft)}
.rosterbtn svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--court);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rosterbtn b{display:block;font-size:15.5px}.rosterbtn small{display:block;font-size:12px;color:var(--muted)}
.rosterbtn .go{margin-left:auto;color:var(--muted);font-size:20px}
.optrow{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-width:46px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--court);color:var(--on-court);border-color:var(--court)}
.so.off b{color:var(--muted);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* 하단 탭 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:160px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px;cursor:pointer}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--court-txt)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* 시트 */
.ov{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgb(0 0 0/.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.shd{position:relative;padding:14px 48px 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shd h3{margin:0;font:400 21px/1.2 var(--title)}
.shd p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.shx{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;border-radius:50%}
.sbody{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sfoot{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sfoot .btn{flex:1}
.sfoot .btn.del{flex:0 0 auto;color:var(--danger)}
.fl{display:grid;gap:6px}
.fl>label,.fl>.lb{font-size:12.5px;font-weight:700;color:var(--muted)}
input[type=date],input[type=search],input[type=text]{width:100%;min-height:44px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:1.5px dashed var(--court-rule);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.slot.on{border-style:solid;border-color:var(--line);background:var(--court-soft)}
.slot b{font-size:16px}.slot .ph{color:var(--muted)}
.slot small{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slots.one{grid-template-columns:1fr}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.score .side{display:grid;gap:4px;justify-items:center}
.score .side span{font-size:12px;font-weight:700;color:var(--muted)}
.score input{width:100%;max-width:120px;min-height:64px;text-align:center;font:700 40px/1 var(--num);border:2px solid var(--court-rule);border-radius:14px;background:var(--surface);padding:0}
.score .vs{font:700 22px var(--num);color:var(--muted)}
.verdict{text-align:center;min-height:30px}
.verdict span{display:inline-block;padding:3px 14px;border-radius:99px;font:700 14px/1.6 var(--body)}
.verdict .w{background:var(--win);color:var(--win-ink)}
.verdict .l{background:var(--lose);color:#fff}
.verdict .d{background:var(--seg);color:var(--muted)}
.verdict .h{color:var(--muted);font-weight:500;font-size:13px}
.linkbtn{justify-self:start;border:1px solid var(--court-rule);border-radius:99px;background:var(--surface);color:var(--court-txt);padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.confirm{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));display:grid;gap:10px}
.confirm p{margin:0;font-weight:500}
.confirm div{display:flex;gap:8px}.confirm .btn{flex:1}

/* 이름 시트 */
.pick .sbody{gap:4px}
.swh{font-size:12px;font-weight:700;color:var(--muted);margin:10px 4px 2px}
.so{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin:2px 0;cursor:pointer}
.so:hover{background:var(--court-soft)}
.so b{font-size:15.5px}
.so .mt{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.so:disabled{opacity:.4;cursor:not-allowed}
.so.add{border-style:dashed;border-color:var(--court-rule);color:var(--court-txt)}
.so.clear{justify-content:center;color:var(--muted)}

.hist .g{border-top:1px solid var(--line)}
.hist .dline{font-size:11.5px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 32px);padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.store{font-size:11.5px;color:var(--muted);text-align:center;margin:22px 0 0}
@media (max-width:360px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.ticket .k b{font-size:40px}.ticket .wl{font-size:28px}}

/* ===== v2 프로 스타일: 숫자가 주인공, 남색 히어로, 테두리 대신 명암 ===== */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface2:#f5f7f6; --line:#e3e8e5; --muted:#69736d;
  --hero:#01023c; --hero2:#0d1257; --on-hero:#ffffff; --volt:#d4ff3d; --coral:#ff7a66; --winink:#3d7a00;
  --title:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --disp:'Barlow Condensed','Noto Sans KR',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090f; --surface:#12141d; --surface2:#191c27; --line:#232736; --muted:#8d93a6;
  --hero:#0d1257; --hero2:#161c6e; --navy:#e8ebff; --court:#2fd27f; --on-court:#04170d; --winink:#d4ff3d}}
:root[data-theme="dark"]{
  --bg:#08090f; --surface:#12141d; --surface2:#191c27; --line:#232736; --muted:#8d93a6;
  --hero:#0d1257; --hero2:#161c6e; --navy:#e8ebff; --court:#2fd27f; --on-court:#04170d; --winink:#d4ff3d}

/* 제목은 굵은 고딕 하나로 */
.day>summary .dt,.empty h2,.h2,.shd h3{font-weight:800;letter-spacing:-.02em}
.h2{font-size:17px;margin:26px 2px 10px}
.label{font:700 12.5px/1 var(--body);letter-spacing:-.01em;color:var(--muted)}

/* 히어로 */
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr) 62px;gap:4px 16px;align-items:center;padding:18px 16px 16px 18px;margin:6px 0 10px;border-radius:24px;min-height:0;
  background:radial-gradient(120% 140% at 0% 0%,var(--hero2) 0%,var(--hero) 60%);color:var(--on-hero);box-shadow:0 10px 30px -14px rgb(1 2 60 / .55)}
.ticket::before,.ticket::after{display:none}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgb(255 255 255 / .12);stroke-width:9}
.ring .val{fill:none;stroke:var(--volt);stroke-width:9;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.ring .val{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .in b{font:italic 800 36px/1 var(--disp);letter-spacing:-.01em}
.ring .in b small{font-size:18px;margin-left:1px}
.ring .in span{margin-top:6px;font:800 13px/1 var(--body);opacity:.75}
.hm{display:grid;gap:10px;min-width:0}
.hm .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid rgb(255 255 255 / .1);padding-bottom:8px}
.hm .row:last-child{border-bottom:0;padding-bottom:0}
.hm .row span{font:700 13px/1 var(--body);opacity:.7}
.hm .row b em,.st b em{font:800 13px/1 var(--body);font-style:normal;margin-left:2px;opacity:.9}
.hm .row b{font:italic 800 22px/1 var(--disp);white-space:nowrap}
.hm .row b .w{color:var(--volt)}.hm .row b .l{color:var(--coral)}
.ticket .mascot{position:relative;right:auto;bottom:auto;align-self:end;justify-self:end;width:62px;height:80px;pointer-events:auto;cursor:pointer}
.ticket .mascot .shadow{background:rgb(0 0 0 / .35)}
.form{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid rgb(255 255 255 / .1)}
.form .label{color:var(--on-hero);opacity:.65;flex:none}
.form .chips{display:flex;gap:4px;flex:1;min-width:0;justify-content:flex-end}
.form i{flex:0 1 26px;min-width:0;height:26px;border-radius:7px;display:grid;place-items:center;font:800 12.5px/1 var(--body);font-style:normal}
.form i.w{background:var(--volt);color:#01023c}
.form i.l{background:rgb(255 122 102 / .16);color:var(--coral);box-shadow:inset 0 0 0 1px rgb(255 122 102 / .45)}
.form i.d{background:rgb(255 255 255 / .14);color:#fff}
.form i.e{border:1px dashed rgb(255 255 255 / .2)}
.heroempty{grid-column:2/3;font-size:13.5px;line-height:1.5;opacity:.85}
@media (max-width:390px){.ticket{gap:4px 12px;padding:16px 12px 14px 14px;grid-template-columns:auto minmax(0,1fr) 52px}.ticket .mascot{width:52px;height:70px}.ring{width:92px;height:92px}.ring .in b{font-size:30px}.hm .row b{font-size:19px}}


/* 섹션 머리 */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 4px}
.sechead h2{margin:0;font:800 17px/1.2 var(--title);letter-spacing:-.02em;color:var(--navy)}

/* 경기 목록: 테두리 대신 흰 면 */
.games,.plist,.tblwrap{border:0;box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.day{margin-top:16px}
.day>summary .dt{font-size:15px;color:var(--navy)}
.day>summary::after{background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat;height:9px}
.day>summary .pill{background:transparent;padding:0;font:italic 700 14px/1 var(--disp);letter-spacing:.02em;color:var(--muted)}
.g{grid-template-columns:4px auto minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 0;border-top-color:var(--line)}
.g::before{content:'';align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.g.win::before{background:var(--volt)}
.g.lose::before{background:var(--coral)}
.g .res{width:auto;height:auto;background:none!important;color:var(--muted);font:800 17px/1 var(--body)}
.g.win .res{color:var(--winink)}.g.lose .res{color:#c23d30}
.g .who .them{font-size:15.5px;font-weight:700;color:var(--ink)}
.g .who .them small{display:none}
.g .who .us{font-size:12px}
.g .sc{font:italic 800 26px/1 var(--disp);letter-spacing:.01em}
.g .sc .m{color:var(--navy)}.g .sc .t{color:var(--muted)}
.g.win .sc .m{color:var(--navy)}
.g .mode{font:700 12px/1 var(--body);margin-top:5px}

/* 통계 타일 */
.st{border:0;box-shadow:0 1px 2px rgb(1 2 60 / .05);padding:12px 12px 10px}
.st small{font:700 12.5px/1 var(--body)}
.st b{font:italic 800 32px/1.1 var(--disp);margin-top:6px}
.st.hl{background:var(--hero);color:var(--on-hero)}
.st.hl b{color:var(--volt)}
.pc,.streak,.rosterbtn{border:0;box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.pc.best{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--court-rule)}
td{font:italic 700 18px var(--disp)}
.fchip{border:0;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .06)}
.fchip[aria-pressed="true"]{background:var(--hero);color:#fff}

/* 하단 탭 + 가운데 기록 버튼 */
.dock{align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{font-size:10.5px;letter-spacing:.02em}
.tab[aria-current="page"]{color:var(--navy)}
.fab{flex:none;width:58px;height:58px;margin:-26px 6px 0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--court);color:#fff;cursor:pointer;
  box-shadow:0 8px 20px -6px color-mix(in srgb,var(--court) 70%,transparent),0 0 0 5px var(--bg)}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.fab:active{transform:scale(.95)}

/* 시트 */
.sheet{border-radius:26px 26px 0 0}
.score input{font:italic 800 44px/1 var(--disp);border-width:0;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line)}
.score input:focus{box-shadow:inset 0 0 0 2px var(--court)}
.slot{border-width:0;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line)}
.slot.on{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--court-rule)}
.seg{background:var(--surface2)}
.btn{border-color:transparent;background:var(--surface2)}
.btn.primary{background:var(--court);color:#fff}
.mepill{border:0;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .08)}
.logo{border:0;box-shadow:0 1px 2px rgb(1 2 60 / .1)}
.empty{border:0;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.empty h2{font-size:18px;color:var(--navy)}
.nudge{border-width:0;box-shadow:inset 0 0 0 1.5px var(--win)}
.rank3 .prow b{display:flex;align-items:center;gap:10px}
.rank3 .rk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);font:italic 800 15px/1 var(--disp);color:var(--navy)}
.rank3 .prow:first-child .rk{background:var(--hero);color:var(--volt)}
.rank3 .meta{padding-left:34px}
tr.sum td{border-top:2px solid var(--line);border-bottom:0;background:var(--surface2);font-weight:800;color:var(--navy)}
tr.sum td:first-child{font-weight:800}

/* ===== 테마 A: 요넥스 블루 + 코트 그린 ===== */
:root{
  --bg:#eef3f9; --surface2:#f3f6fa; --line:#e1e7ef; --muted:#66717f;
  --navy:#0c50a1; --hero:#0c50a1; --hero2:#1a64bf; --volt:#7fe08f; --coral:#cfdcf0;
  --court:#1d9533; --on-court:#ffffff; --court-soft:#e7f4ea; --court-rule:#a6d8b1;
  --win:#1d9533; --win-ink:#ffffff; --winink:#17812b; --lose:#8a97aa; --losebar:#b9c6d8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b12; --surface:#101722; --surface2:#16202e; --line:#1f2a3a; --muted:#8b97a8;
  --navy:#cfe0ff; --hero:#0c50a1; --hero2:#1a64bf; --court:#2bb24a; --court-soft:#13261a; --court-rule:#2e6b3d;
  --winink:#5fd77a; --lose:#8b97a8; --losebar:#3a4a60}}
:root[data-theme="dark"]{
  --bg:#070b12; --surface:#101722; --surface2:#16202e; --line:#1f2a3a; --muted:#8b97a8;
  --navy:#cfe0ff; --hero:#0c50a1; --hero2:#1a64bf; --court:#2bb24a; --court-soft:#13261a; --court-rule:#2e6b3d;
  --winink:#5fd77a; --lose:#8b97a8; --losebar:#3a4a60}
.ticket{box-shadow:0 10px 30px -14px rgb(12 80 161 / .6)}
.form i.w{background:var(--court);color:#fff}
.form i.l{background:rgb(255 255 255 / .16);color:#cfe0f7;box-shadow:none}
.hm .row b .w{color:var(--volt)}.hm .row b .l{color:#c3d5f0}
.g.win::before{background:var(--court)}
.g.lose::before{background:var(--losebar)}
.g.lose .res{color:var(--lose)}
.st.hl b{color:var(--volt)}
.mast h1 em{color:var(--court)}

.dock{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;justify-items:center}
.dock .tab{width:100%;max-width:none}
.dock .tab[hidden]{display:none!important}

/* 섹션 제목: 네모 아이콘 + 코트 라인 */
:root{--icbg:#e3edf9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--icbg:#1a2a44}}
:root[data-theme="dark"]{--icbg:#1a2a44}
.ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--icbg);color:var(--navy);display:inline-grid;place-items:center}
.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.h2{display:flex;align-items:center;gap:8px;color:var(--navy)}
.h2::after{content:'';flex:1;min-width:16px;height:1px;background:var(--line)}
.h2 small{white-space:nowrap}
.sechead{align-items:center;gap:8px}
.sechead h2{display:flex;align-items:center;gap:8px;flex:1}
.sechead h2::after{content:'';flex:1;min-width:16px;height:1px;background:var(--line)}
.day>summary{gap:8px}
/* 기록 버튼: 기울인 초록 사각 + 셔틀콕 */
.fab{width:58px;height:58px;border-radius:18px;transform:rotate(-8deg);background:var(--court);box-shadow:0 0 0 5px var(--surface),6px 6px 0 0 var(--hero)}
.fab svg{width:42px;height:42px;stroke:none;fill:initial}
.fab:active{transform:rotate(-8deg) scale(.94)}
@media (prefers-reduced-motion:no-preference){.fab{transition:transform .15s}.fab:hover{transform:rotate(-14deg)}}
/* 매치업 토글: 영문 스포츠 글꼴 */
#roleSeg button{font:italic 800 15px/1 var(--disp);letter-spacing:.08em}

/* 통계 타일 B: 한 줄에 라벨 왼쪽, 숫자 오른쪽 */
.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.st{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:14px}
.st small{flex:none}
.st b{margin:0;font-size:30px;text-align:right;white-space:nowrap}
.st b em{font-size:16px}
/* 연승 배지 한 줄 */
.streak .sb{flex:none;white-space:nowrap;padding:6px 14px;font-size:22px;line-height:1}

.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.pnav b{font:800 15px/1.2 var(--body);color:var(--navy);text-align:center}
.pnav button{width:40px;height:40px;border:0;border-radius:10px;background:var(--surface2);font:700 22px/1 var(--body);color:var(--navy);cursor:pointer}
.pnav button:disabled{opacity:.3;cursor:default}

/* 경기 입력: 한 화면에 */
.gsheet .shd{padding-block:12px 10px}
.gsheet .sbody{gap:12px;padding-top:12px}
.gtop{display:flex;align-items:center;gap:8px}
.datechip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);font:800 14px var(--body);color:var(--navy);white-space:nowrap;cursor:pointer}
.datechip svg,.lastbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;min-height:0;cursor:pointer}
.gtop .seg{flex:1;min-width:0}
.gtop .seg button{min-height:38px}
.lastbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:42px;padding:0 10px;border:0;border-radius:12px;background:var(--court-soft);color:var(--court-txt);font:800 13px var(--body);cursor:pointer}
.court{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;padding:12px;border-radius:18px;background:var(--surface2)}
.court .team{display:grid;gap:8px;align-content:start}
.court .tl{font:800 12.5px var(--body);color:var(--muted);text-align:center}
.court .vs{align-self:center;font:italic 800 18px/1 var(--disp);color:var(--muted)}
.court .slot{min-height:44px;padding:6px 10px;justify-content:center;text-align:center;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.court .slot.on{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--court-rule)}
.court .slot b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.court .slot .ph{font-size:14px;color:var(--muted)}
.court .slot.me{cursor:default;flex-direction:column;gap:0;box-shadow:none;background:var(--icbg)}
.court .slot.me b{color:var(--navy);font-size:14px;line-height:1.2}
.court .slot.me small{font-size:11px;color:var(--muted);line-height:1.2}
.court.single .slot.me,.court.single .slot{min-height:44px}
.court .sc{width:100%;min-height:60px;text-align:center;font:italic 800 40px/1 var(--disp);color:var(--navy);border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:0}
.court .sc:focus{outline:none;box-shadow:inset 0 0 0 2px var(--court)}
.gsheet .verdict{min-height:26px;margin-top:-4px}

/* 전적 표기: 2승 0패 / 승률 100% */
.rec2 strong{font:italic 800 22px/1 var(--disp);color:var(--navy);white-space:nowrap}
.rec2 strong em{font:800 13px/1 var(--body);font-style:normal;margin:0 1px 0 1px;color:var(--muted)}
.rec2 span{display:block;margin-top:5px;font:700 12px/1 var(--body);color:var(--muted);white-space:nowrap}
.rec2 span i{font:italic 800 14px/1 var(--disp);font-style:italic;margin-left:2px}
.rec2 span i.up{color:var(--court-txt)}.rec2 span i.dn{color:#c23d30}

/* 경기 줄: 승패 글자와 상대 이름을 같은 줄에, 파트너는 아래 */
.g{align-items:start}
.g::before{align-self:stretch}
.g .res{line-height:22px;padding-top:1px}
.g .who{line-height:1.4}
.g .who .them{line-height:22px}
.g .who .us{display:inline-block;margin-top:2px}
.g .sc{line-height:22px;display:block}

/* 매치업 목록: 선수별 전적·득점·실점 */
.mlist .prow{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 14px}
.mtop{display:flex;align-items:baseline;gap:8px;min-width:0}
.mtop b{font-size:16px;color:var(--ink)}
.mtop .meta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrate{flex:none;font:700 12px/1 var(--body);color:var(--muted)}
.mrate i{font:italic 800 17px/1 var(--disp);margin-left:2px}
.mrate i.up{color:var(--court-txt)}.mrate i.dn{color:#c23d30}
.pstat{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-radius:12px;background:var(--surface2);overflow:hidden}
.pstat>span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
.pstat>span+span{box-shadow:inset 1px 0 0 var(--line)}
.pstat i{font:700 11.5px/1 var(--body);font-style:normal;color:var(--muted)}
.pstat b{font:italic 800 20px/1 var(--disp);color:var(--navy);white-space:nowrap}
.pstat b em{font:800 12px/1 var(--body);font-style:normal;color:var(--muted);margin:0 1px}

/* ===== 프로 기능 묶음 ===== */
.btn.primary{background:var(--hero);border-color:var(--hero);color:#fff}
.opt[aria-pressed="true"]{background:var(--hero);border-color:var(--hero);color:#fff}
.linkbtn{color:var(--hero-txt);background:var(--icbg);border-color:transparent}
.lastbtn{color:var(--hero-txt);background:var(--icbg)}
.insight{display:flex;align-items:center;gap:12px;margin:10px 0 0;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.insight .ii{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--icbg);color:var(--hero-txt)}
.insight .ii svg{width:20px;height:20px}
.insight b{display:block;font-size:15px;color:var(--navy)}
.insight small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.logq{position:relative;margin:4px 0 2px}
.logq input{padding-left:12px;border:0;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .06);border-radius:12px;font-size:14px}
.btn.more{width:100%;margin-top:12px;background:var(--surface)}
.empty.first{position:relative;text-align:center;padding-bottom:56px}
.empty.first p{margin:0 auto}
.empty.first .down{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:var(--court-txt);width:28px;height:28px}
@media (prefers-reduced-motion:no-preference){.empty.first .down{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,6px)}}}
.empty.first .down svg{width:28px;height:28px}
.sc.nos .m{font:800 17px/22px var(--body)}
.g.win .sc.nos .m{color:var(--court-txt)}.g.lose .sc.nos .m{color:var(--lose)}
.chart{padding:10px 10px 8px;border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .gl.mid{stroke-dasharray:4 4;stroke:var(--muted);opacity:.5}
.chart .ax{font:600 10px var(--body);fill:var(--muted);text-anchor:end}
.chart .ar{fill:var(--hero);opacity:.08}
.chart .ln{fill:none;stroke:var(--hero);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--court);stroke:var(--surface);stroke-width:2}
.chart .lv{font:italic 800 15px var(--disp);fill:var(--navy)}
.heat{padding:12px;border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05)}
.hg{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px}
.hg i,.lg i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.lg i{width:10px;height:10px;display:inline-block;vertical-align:middle}
.hz1{background:#bfe3c7!important}.hz2{background:#78c88b!important}.hz4{background:var(--court)!important}.hzx{background:transparent!important;box-shadow:inset 0 0 0 1px var(--line)}
.hl{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:700 11.5px var(--body);color:var(--muted);flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{display:grid;justify-items:center;text-align:center;gap:4px;padding:12px 6px 10px;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05);opacity:.45;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none}
.bdg .bi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--icbg);color:var(--hero-txt)}
.bdg.on .bi{background:var(--hero);color:var(--volt)}
.bdg .bi svg{width:22px;height:22px}
.bdg b{font-size:13px;color:var(--navy)}
.bdg small{font-size:10.5px;line-height:1.3;color:var(--muted)}
.st small{display:flex;flex-direction:column;gap:3px}
.dl{font:700 10.5px/1 var(--body);font-style:normal;color:var(--muted)}
.dl.up{color:var(--court-txt)}.dl.dn{color:#c23d30}
.freq{display:grid;gap:6px}
.freq .lb{font-size:12.5px;font-weight:700;color:var(--muted)}
.fr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fr .fchip{flex:none;min-height:34px;padding:4px 12px;font-size:13.5px;color:var(--ink)}
.gopts{display:flex;justify-content:center}
.court .wl{min-height:60px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font:800 16px var(--body);color:var(--muted);cursor:pointer}
.court .wl.on{background:var(--court);color:#fff;box-shadow:none}
.court .wl.lose.on{background:var(--lose);color:#fff}
.verdict .warn{color:#b3412f;font-weight:700}
.toast{display:flex;align-items:center;gap:10px;border-radius:16px}
.toast.hasact{padding:8px 8px 8px 16px}
.toast .tact{flex:none;border:0;border-radius:99px;padding:7px 12px;background:rgb(255 255 255 / .16);color:inherit;font:800 13px var(--body);cursor:pointer}
.myinfo .optrow{gap:5px}.myinfo .opt{min-width:40px;min-height:36px;padding:4px 10px;font-size:13px}

/* 점수 표기 3번: 가운데 점, 이긴 쪽 숫자만 진하게 (왼쪽 띠 유지) */
.g .sc.dotsc{display:flex;align-items:center;justify-content:flex-end}
.g .sc.dotsc .sw{color:var(--navy)}
.g .sc.dotsc .sl{color:#8a95a3}
.g .sc.dotsc .sdot{width:5px;height:5px;border-radius:50%;background:#b5bdc8;margin:0 10px;flex:none}
.g .res{color:var(--lose)}
.g.win .res{color:var(--winink)}

/* 검색 결과 */
.qres{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--hero);color:#fff;font-size:13px}
.qres b{font-weight:800}
.qres .tact{flex:none;border:0;border-radius:99px;padding:6px 12px;background:rgb(255 255 255 / .18);color:#fff;font:800 12.5px var(--body);cursor:pointer}
.g mark{background:color-mix(in srgb,var(--volt) 55%,transparent);color:inherit;border-radius:4px;padding:0 2px}

/* 검색 결과 요약 카드 A */
.qcard{margin:10px 0 0;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60 / .05);font-family:var(--body)}
.qhd{display:flex;align-items:center;gap:8px}
.qhd .ic{width:28px;height:28px}
.qhd .ic svg{width:16px;height:16px}
.qhd b{flex:1;min-width:0;font:800 15px/1.3 var(--body);color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qclose{flex:none;min-height:32px;padding:0 14px;border:0;border-radius:99px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);font:700 13px var(--body);color:var(--muted);cursor:pointer}
.q3{display:grid;grid-template-columns:1fr 1.4fr 1fr;margin-top:10px;border-radius:12px;background:var(--surface2);overflow:hidden}
.q3>div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px}
.q3>div+div{box-shadow:inset 1px 0 0 var(--line)}
.q3 small{font:700 12px/1 var(--body);color:var(--muted)}
.q3 .N{font:italic 800 24px/1 var(--disp);color:var(--navy);white-space:nowrap}
.q3 .N em{font:800 12.5px/1 var(--body);font-style:normal;color:var(--muted);margin:0 1px}

.qhd .qsub{font:700 13px var(--body);color:var(--muted)}
.qnames{margin:8px 0 0 36px;font-size:12.5px;color:var(--muted)}

/* % 기호: 숫자와 같은 스포츠 글꼴, 작게, 위로 */
.pct{display:inline-block;font-family:var(--disp)!important;font-style:italic;font-weight:800;font-size:.68em!important;line-height:1;vertical-align:baseline;margin-left:.04em;letter-spacing:0}
.ring .in b .pct{font-size:.66em!important;vertical-align:baseline}
.appver{margin:26px 0 6px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);display:grid;gap:3px}
.appver b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--muted)}
.appver span{font-size:12px;font-variant-numeric:tabular-nums}
.appver i{display:inline-block;width:1px;height:10px;background:var(--line);margin:0 9px;vertical-align:-1px}
.fxvol,.fxth{display:flex;align-items:center;gap:12px;margin-top:12px}
.fxvol>span,.fxth>span{flex:none;width:44px;font-size:13px;font-weight:700;color:var(--muted)}
.fxvol input{flex:1;accent-color:#0c50a1;height:28px}
.fxvol b{flex:none;width:30px;text-align:right;font-family:var(--disp);font-style:italic;font-weight:800;font-size:18px}
.fxth .optrow{flex:1;margin:0}
.fxbox.snd-off .fxvol,.fxbox.snd-off .fxth{opacity:.4}

.chart .pt{fill:var(--surface);stroke:var(--hero);stroke-width:2}
.chart .ax.dx{font:700 10.5px var(--body);fill:var(--muted)}

.chart .gl.zero{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:none;opacity:.6}
.chart .au{fill:var(--court);opacity:.16}
.chart .ad{fill:#c23d30;opacity:.1}
.mgsum{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;border-radius:12px;background:var(--surface2);overflow:hidden}
.mgsum>span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
.mgsum>span+span{box-shadow:inset 1px 0 0 var(--line)}
.mgsum small{font:700 11.5px/1 var(--body);color:var(--muted)}
.mgsum b{font:italic 800 22px/1 var(--disp);color:var(--navy);white-space:nowrap}
.mgsum b.up{color:var(--court-txt)}.mgsum b.dn{color:#c23d30}
.mgsum b em{font:800 12px var(--body);font-style:normal;color:var(--muted);margin:0 1px}
.mgsum i{font:700 10.5px/1 var(--body);font-style:normal;color:var(--muted)}

.chart .arU{fill:var(--court);opacity:.12}.chart .arD{fill:#c23d30;opacity:.08}
.chart .pw{fill:var(--court)}.chart .pl{fill:#c4ccd6}
.chart .last{stroke:var(--surface);stroke-width:2}
.tstat{display:grid;grid-template-columns:1fr 1fr 1.4fr;margin:0 0 8px;border-radius:12px;background:var(--surface2);overflow:hidden}
.tstat>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}
.tstat>div+div{box-shadow:inset 1px 0 0 var(--line)}
.tstat small{font:700 11.5px/1 var(--body);color:var(--muted)}
.tstat b{font:italic 800 22px/1 var(--disp);color:var(--navy);white-space:nowrap}
.tstat b.up{color:var(--court-txt)}.tstat b.dn{color:#c23d30}
.tstat b em{font:800 12px/1 var(--body);font-style:normal;color:var(--muted);margin:0 1px}

/* 득점률 */
.prc .prtop{display:flex;align-items:center;gap:12px;padding:4px 4px 10px}
.prc .prtop b{font:italic 800 40px/1 var(--disp);color:var(--navy);white-space:nowrap}
.prc .prtop b.up{color:var(--court-txt)}
.prc .prtop p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4}
.prc .prtop p strong{color:var(--navy)}
.prbar{position:relative;height:12px;border-radius:99px;background:var(--losebar);overflow:hidden;margin:0 4px}
.prbar i{position:absolute;left:0;top:0;bottom:0;background:var(--court);border-radius:99px 0 0 99px}
.prbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--surface)}
.prlg{display:flex;justify-content:space-between;margin:6px 4px 0;font:700 11.5px var(--body);color:var(--muted)}
.prlg b{font:italic 800 15px var(--disp);color:var(--navy);margin-left:2px}
/* 접전 */
.cl3{grid-template-columns:1.25fr 1fr 1fr;margin:0 0 6px}
.cl3 b{font-size:20px!important}
.cl3 small{text-align:center;line-height:1.2!important}
.cl3>div>i{font:italic 800 14px/1 var(--disp);color:var(--muted)}
.cl3>div>i.up{color:var(--court-txt)}.cl3>div>i.dn{color:#c23d30}
.cl3>div:last-child>i{font:700 11px/1 var(--body)}
/* 급수별 */
.glist{margin-top:0}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow b{display:block;font-size:15px;color:var(--ink)}
.grow small{display:block;font-size:12px;color:var(--muted)}
.gv{display:grid;grid-template-columns:auto;justify-items:end;gap:4px;flex:none}
.gv strong{font:italic 800 21px/1 var(--disp);color:var(--navy);white-space:nowrap}
.gv strong em{font:800 12.5px/1 var(--body);font-style:normal;color:var(--muted);margin:0 1px}
.gv .bar{margin:0;width:72px}
.gv em{font:italic 800 14px/1 var(--disp);font-style:italic;color:var(--muted)}
.gv em.up{color:var(--court-txt)}.gv em.dn{color:#c23d30}
.gv{grid-template-columns:auto auto;align-items:center}
.gv strong{grid-column:1/-1}
/* 역대 기록 */
.rlist{margin-top:0}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow>div{flex:1;min-width:0}
.rrow b{display:block;font-size:14.5px;color:var(--ink)}
.rrow small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow strong{flex:none;display:flex;align-items:center;font:italic 800 24px/1 var(--disp);color:var(--navy);white-space:nowrap}
.rrow strong em{font:800 12.5px/1 var(--body);font-style:normal;color:var(--muted);margin-left:2px}
.rrow .rdot{width:4px;height:4px;border-radius:50%;background:#b5bdc8;margin:0 6px}
.rrow:first-child .ic{background:var(--hero);color:var(--volt)}

/* 승률 변화 막대 */
.gvd{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 0 6px;border-radius:12px;background:var(--surface2)}
.gvd .gar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#fff;background:var(--muted)}
.gvd.up .gar{background:var(--court)}.gvd.dn .gar{background:#c23d30}
.gvd b{display:block;font:800 17px/1.2 var(--body);color:var(--navy)}
.gvd.up b{color:var(--court-txt)}.gvd.dn b{color:#c23d30}
.gvd small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.gvd small strong{color:var(--navy)}
.gro .bp{fill:#c9d6e8}
.gro .bl{fill:var(--hero)}.gro .bl.up{fill:var(--court)}.gro .bl.dn{fill:#c23d30}
.gro .bv{font:italic 800 13px var(--disp);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.gro .bv.on{fill:var(--navy);font-size:15px}
.gro .bvp{font-size:.8em;font-weight:800}
.gro .bx{font:700 10.5px var(--body);fill:var(--muted)}
.gro .bx.on{fill:var(--navy);font-weight:800}

.toast{bottom:calc(104px + env(safe-area-inset-bottom,0px));left:16px;right:16px;transform:none;width:auto;max-width:480px;margin:0 auto;flex-wrap:wrap;justify-content:center;text-align:center;line-height:1.45;padding:12px 16px}

.stbtn{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}

/* 경기 줄: 1줄(승패·상대·점수) 가운데 맞춤, 2줄(파트너·복식) */
.g.g2{display:grid;grid-template-columns:4px auto minmax(0,1fr) auto;grid-template-areas:"bar gd gd gd" "bar res them sc" "bar . us mode";align-items:center;column-gap:12px;row-gap:2px;padding:12px 14px 12px 0}
.g.g2::before{grid-area:1/1/4/2;align-self:stretch}
.g.g2 .gd{grid-area:gd;font-size:11.5px;color:var(--muted);line-height:1.3}
.g.g2 .res{grid-area:res;line-height:1;padding:0;display:flex;align-items:center}
.g.g2 .them{grid-area:them;font:700 15.5px/1.3 var(--body);color:var(--ink);min-width:0;overflow-wrap:anywhere}
.g.g2 .gsc{grid-area:sc;display:flex;align-items:center;justify-content:flex-end}
.g.g2 .gsc .sc{line-height:1}
.g.g2 .us{grid-area:us;font-size:12px;color:var(--muted);line-height:1.3;margin:0}
.g.g2 .mode{grid-area:mode;margin:0;text-align:right;line-height:1.3}

/* 홈 승률 카드: 오늘·연속·통산 크게 */
.hm{gap:6px}
.hm .row{align-items:center;padding-bottom:7px}
.hm .row>span{font:800 15px/1 var(--body);opacity:.8}
.hm .row b{font:italic 800 28px/1 var(--disp)}
.hm .row b em{font:800 14px/1 var(--body)!important;margin-left:1px}
.ticket{grid-template-columns:auto minmax(0,1fr) 58px;gap:4px 14px}

@media (max-width:390px){.ticket{grid-template-columns:auto minmax(0,1fr) 50px;gap:4px 10px}.ring{width:88px;height:88px}.hm .row b{font-size:25px}.hm .row>span{font-size:14px}}
.tz .hm .row b{font-size:24px}
.tz .hm .row>span{font-size:14px}

/* 마스코트: 가만히 있을 때도 숨 쉬듯 살짝 움직이고, 가끔 셔틀콕을 톡톡 */
@keyframes idleBody{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.5px) scale(1.015,.985)}}
@keyframes idleRk{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(0)}}
@keyframes idleSh{0%,70%,100%{transform:translate(27px,-7px) rotate(0)}79%{transform:translate(26px,-20px) rotate(-150deg)}88%{transform:translate(27px,-8px) rotate(-340deg)}}
.mascot:not([data-a]) .mc-body{animation:idleBody 2.8s ease-in-out infinite}
.mascot:not([data-a]) .mc-rk{animation:idleRk 5.6s ease-in-out infinite}
.mascot:not([data-a]) .mc-sh{animation:idleSh 5.6s ease-in-out infinite}
.hm .row b span{font:inherit;opacity:1}

/* ===== 2026.10.25 검수 보완 ===== */
:root{--court-txt:#17812b;--hero-txt:#0c50a1;--muted:#5f6a78}

:root[data-theme="dark"] .chart .ln{stroke:#6ea8ff}:root[data-theme="dark"] .chart .ar{fill:#6ea8ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chart .gln,:root:not([data-theme="light"]) .chart .gp{stroke:#6ea8ff}:root:not([data-theme="light"]) .chart .ga{fill:#6ea8ff}}
:root[data-theme="dark"] .chart .gln,:root[data-theme="dark"] .chart .gp{stroke:#6ea8ff}:root[data-theme="dark"] .chart .ga{fill:#6ea8ff}
/* 넓은 화면(태블릿·PC)에서 하단 탭이 화면 끝까지 퍼지지 않게 */
.dock{padding-left:max(8px,env(safe-area-inset-left,0px),calc((100% - 620px) / 2));padding-right:max(8px,env(safe-area-inset-right,0px),calc((100% - 620px) / 2))}

/* ===== 마이페이지 (시안 C) ===== */
.sbody.mp{display:block;padding-top:6px;background:var(--bg)}

.mp-who{min-width:0;flex:1}.mp-who h4{margin:0;font:800 22px/1.2 var(--body);letter-spacing:-.03em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mp-tag{margin:22px 4px 8px;font:700 13px/1 var(--body);color:var(--muted)}

button.mp-row:active,label.mp-pick:active{background:var(--surface2)}
.mp-row+.mp-row{box-shadow:inset 0 1px 0 var(--line)}
.mp-t{flex:1;min-width:0}.mp-t b{display:block;font:700 15.5px/1.3 var(--body);color:var(--ink)}.mp-t small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.mp-chev{flex:none;width:18px;height:18px;fill:none;stroke:#a3adba;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mp-val{font:700 14px var(--body);color:var(--muted)}
.mp-pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.mp-seg{flex:none;display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface2)}
.mp-seg button{min-width:40px;min-height:36px;padding:0 9px;border:0;border-radius:9px;background:transparent;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.mp-seg button[aria-pressed="true"]{background:var(--surface);color:var(--hero-txt);box-shadow:0 1px 3px rgb(12 40 90/.18)}
.mp-sw{flex:none;position:relative;width:52px;height:32px;border:0;border-radius:99px;background:#cfd6df;cursor:pointer;transition:background .15s}
.mp-sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .15s}
.mp-sw[aria-checked="true"]{background:var(--court)}.mp-sw[aria-checked="true"]::after{transform:translateX(20px)}
.mp-keep{background:var(--surface);border-radius:18px;padding:16px}
.mp-stat{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mp-n{flex:none;min-width:48px;font:800 italic 46px/.9 var(--disp);color:#b4561c;text-align:center}
.mp-stat.ok .mp-n{width:46px;height:46px;min-width:0;border-radius:50%;background:var(--court-soft);display:grid;place-items:center}
.mp-n svg{width:24px;height:24px;fill:none;stroke:var(--court-txt);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mp-cta{width:100%;min-height:52px;border-radius:14px;font-size:16px}
.mp-more{margin-top:8px;padding:14px;background:var(--surface);border-radius:18px;display:grid;gap:8px}
.sbody.mp #bkPaste{margin-top:8px;padding:14px;background:var(--surface);border-radius:18px}
.mp-lb{flex:none;width:44px;font:700 14px var(--body);color:var(--muted)}
.mp-row input[type=range]{flex:1;min-width:0;accent-color:#0c50a1;height:28px}
.mp-volv{flex:none;width:30px;text-align:right;font:800 italic 19px var(--disp);color:var(--ink)}
.fxbox.snd-off .mp-dim{opacity:.4}
.mp-hint{margin:8px 6px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.mp-ver{display:flex;align-items:center;justify-content:center;gap:9px;margin:26px 0 4px;color:var(--muted);font-size:12px}
.mp-ver img{width:26px;height:22px;object-fit:contain;border-radius:5px;background:#fff;padding:1px}
.mp-ver b{font:800 italic 14px var(--disp);letter-spacing:.02em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mp-n{color:#f0a26a}:root:not([data-theme="light"]) .mp-sw:not([aria-checked="true"]){background:#3a4658}}
:root[data-theme="dark"] .mp-n{color:#f0a26a}:root[data-theme="dark"] .mp-sw:not([aria-checked="true"]){background:#3a4658}
@media (max-width:370px){.mp-seg button{min-width:34px;padding:0 6px;font-size:13px}}

.mascot .mc-sh{opacity:1}
.ticket .mascot{overflow:visible}

/* ===== 공지사항 한 줄 띠 ===== */
.nt-band{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:11px 12px 11px 10px;border:0;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgb(1 2 60/.05);text-align:left;color:inherit;cursor:pointer}
.nt-band:active{background:var(--surface2)}
.nt-ib{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--hero);color:#fff}
.nt-ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nt-band b{flex:1;min-width:0;font:700 14.5px/1.3 var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-dt{flex:none;font:700 12.5px var(--body);color:var(--muted)}
.nt-new{flex:none;font:800 italic 13px/1 var(--disp);color:#fff;background:#c23d30;border-radius:6px;padding:3px 5px 2px;letter-spacing:.04em}
.nt-chev{flex:none;width:18px;height:18px;fill:none;stroke:#a3adba;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nt-list{gap:0}
.nt-item{padding:14px 2px 16px}.nt-item+.nt-item{border-top:1px solid var(--line)}
.nt-item h4{margin:0;font:800 17px/1.35 var(--body);color:var(--ink);letter-spacing:-.02em}
.nt-item.first h4{color:var(--hero-txt)}
.nt-when{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.nt-body{margin-top:8px;font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

/* ===== 홈 오른쪽 위 이름 박스 (나이·급수 이름표 + 화살표) ===== */
.mast h1{font-size:clamp(20px,6.4vw,28px)}
.mepill.mebox{max-width:none;gap:7px;height:40px;min-height:40px;padding:4px 7px 4px 4px;border-radius:12px;color:var(--ink)}
.me-av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;font:800 italic 14px/1 var(--disp);letter-spacing:.01em}
.me-av.sm{font-size:11px}
.me-tx{display:grid;text-align:left;line-height:1.15;min-width:0}
.me-tx b{font:800 15px var(--body);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:5.5em}
.me-tx small{font:700 11px var(--body);color:var(--muted);margin-top:3px;white-space:nowrap}
.mepill.mebox .me-chev{width:15px;height:15px;stroke:#a3adba;stroke-width:2.4}
.mepill.mebox.noname .me-av{background:var(--court)}
.mepill.mebox.noname{box-shadow:inset 0 0 0 1.5px var(--court-rule)}

/* ===== 롱 스매시: 셔틀콕이 파란 카드 왼쪽 끝까지 날아감 (--far는 JS가 잼) ===== */
.mascot[data-a=longsmash]{z-index:3}
.mascot[data-a=longsmash] .mc-body{animation:bdSm2 2.8s ease-in-out}
.mascot[data-a=longsmash] .mc-rk{animation:rkSm2 2.8s ease-in-out}
.mascot[data-a=longsmash] .mo{animation:moSm2 2.8s steps(1,end)}.mascot[data-a=longsmash] .mw{animation:mwSm2 2.8s steps(1,end)}
.mascot[data-a=longsmash] .mc-sh{animation:shLs 2.8s linear}
@keyframes shLs{
  0%{transform:translate(27px,-7px) rotate(0);opacity:1;filter:none}
  8%{transform:translate(18px,-42px) rotate(-30deg);opacity:1}
  16%{transform:translate(12px,-34px) rotate(-60deg)}
  40%{transform:translate(24px,-4px) rotate(-80deg);filter:none}
  44%{transform:translate(18px,-2px) rotate(-95deg);filter:drop-shadow(8px -1px 0 rgb(255 255 255/.45)) drop-shadow(16px -2px 0 rgb(255 255 255/.22))}
  58%{transform:translate(calc(var(--far,260px) * -1),18px) rotate(-100deg);filter:drop-shadow(10px -1px 0 rgb(255 255 255/.45)) drop-shadow(20px -2px 0 rgb(255 255 255/.22))}
  62%{transform:translate(calc(var(--far,260px) * -1 + 10px),8px) rotate(-200deg);filter:none}
  70%{transform:translate(calc(var(--far,260px) * -1 + 22px),44px) rotate(-320deg);opacity:1}
  78%{transform:translate(calc(var(--far,260px) * -1 + 26px),58px) rotate(-360deg);opacity:0}
  79%,88%{transform:translate(27px,-30px);opacity:0}
  98%,100%{transform:translate(27px,-7px);opacity:1;filter:none}
}

/* ===== 앱을 켤 때 인사: 손 흔들기 + 둥근 흰 말풍선 ===== */
.mascot .mc-hi{position:absolute;right:50px;top:18px;padding:6px 11px;background:#fff;border-radius:14px;font:800 12.5px/1.2 var(--body);color:#0c50a1;white-space:nowrap;box-shadow:0 2px 6px rgb(0 0 0/.22);opacity:0;transform-origin:100% 60%;pointer-events:none;z-index:4}
.mascot .mc-hi::after{content:'';position:absolute;right:-6px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid #fff;border-right:0}
.mascot[data-a=hello]{z-index:3}
.mascot[data-a=hello] .mc-body{animation:bdWv 2.6s ease-in-out}
.mascot[data-a=hello] .mc-rk{animation:rkWv 2.6s ease-in-out}
.mascot[data-a=hello] .mo{animation:moSm 2.6s steps(1,end)}
.mascot[data-a=hello] .ms{animation:msSm 2.6s steps(1,end)}
.mascot[data-a=hello] .eh{animation:ehCh 2.6s steps(1,end)}
.mascot[data-a=hello] .mc-hi{animation:hiPop 2.6s ease-out}
@keyframes hiPop{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1.12)}14%,84%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92)}}

/* ===== 마이페이지 머리 이름표 = 홈 이름 박스 / 볼륨 막대 ===== */
.mp-me .mp-box{margin:0;cursor:default;height:44px;min-height:44px;padding:5px 12px 5px 5px}
.mp-me .mp-box .me-av{width:34px;height:34px;font-size:15px}
.mp-me .mp-box .me-tx b{font-size:16px;max-width:8em}
.mp-me{justify-content:space-between}
.mp-volrow{gap:14px;padding-top:14px;padding-bottom:14px}
.mp-volic{flex:none;width:28px;height:28px;fill:none;stroke:#3b7cf6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mp-volic .w1{opacity:.75}.mp-volic .w2{opacity:.45}
.mp-vol{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;margin:0;background:transparent;cursor:pointer}
.mp-vol::-webkit-slider-runnable-track{height:16px;border-radius:99px;background:linear-gradient(90deg,#3b7cf6 var(--v,55%),#e6e7eb var(--v,55%))}
.mp-vol::-moz-range-track{height:16px;border-radius:99px;background:#e6e7eb}
.mp-vol::-moz-range-progress{height:16px;border-radius:99px;background:#3b7cf6}
.mp-vol::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-5px;border-radius:50%;background:#fff;border:3px solid #3b7cf6;box-shadow:0 1px 3px rgb(0 0 0/.18)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mp-vol::-webkit-slider-runnable-track{background:linear-gradient(90deg,#3b7cf6 var(--v,55%),#2a3445 var(--v,55%))}:root:not([data-theme="light"]) .mp-vol::-moz-range-track{background:#2a3445}}
:root[data-theme="dark"] .mp-vol::-webkit-slider-runnable-track{background:linear-gradient(90deg,#3b7cf6 var(--v,55%),#2a3445 var(--v,55%))}

let sheetStack = [];
function openSheet(html, cls, onMount) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('.shx')) closeSheet(); });
  $('#sheetRoot').appendChild(ov);
  try { SFX.sheet(); } catch (e) {}
  sheetStack.push(ov);
  document.body.style.overflow = 'hidden';
  onMount && onMount(ov.firstElementChild);
  return ov.firstElementChild;
}
function closeSheet() {
  const ov = sheetStack.pop(); if (ov) ov.remove();
  if (!sheetStack.length) document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });

/* 경기 입력 */
let draft = null;
function openGame(id, pre) {

  if (g && g.res) { draft.ns = true; draft.my = ''; draft.their = ''; }
  const sh = openSheet(`
    <div class="shd"><h3>${g ? '기록 수정' : '경기 기록하기'}</h3><button class="shx" type="button" aria-label="닫기">×</button></div>

    else if (b.dataset.slot) openPicker(b.dataset.slot, sh);

    else if (b.id === 'gNs') { draft.ns = !draft.ns; draft.res = draft.ns ? draft.res : undefined; drawGame(sh); }
    else if (b.dataset.fill) { const n = b.dataset.fill, isD = draft.mode === 'd'; if (isD && !draft.partner) draft.partner = n; else if (!draft.opp[0]) draft.opp[0] = n; else if (isD && !draft.opp[1]) draft.opp[1] = n; else { toast('빈 자리가 없어요. 칸을 눌러 바꿔 주세요.'); return; } drawGame(sh); }
    else if (b.id === 'gLast') { const last = sorted().pop(); if (last) { draft.mode = last.mode; draft.partner = last.partner || ''; draft.opp = [...(last.opp || []), '', ''].slice(0, 2); drawGame(sh); toast('직전 경기 멤버를 불러왔어요'); } }
    else if (b.id === 'gSave') commitGame();

  });

    if (e.target.id === 'gMy') draft.my = e.target.value.replace(/\D/g, '').slice(0, 2);
    if (e.target.id === 'gTheir') draft.their = e.target.value.replace(/\D/g, '').slice(0, 2);
    if (e.target.id === 'gMy' || e.target.id === 'gTheir') { e.target.value = e.target.id === 'gMy' ? draft.my : draft.their; drawVerdict(sh); }

function shortDate(d) { const [Y, M, D] = d.split('-').map(Number); return (d === today() ? '오늘 ' : '') + `${M}.${D} (${WD[new Date(Y, M - 1, D).getDay()]})`; }

function freqChips() {
  const taken = [draft.partner, ...draft.opp].filter(Boolean), cnt = {};
  games.forEach(g => [g.partner, ...(g.opp || [])].forEach(n => { if (n && n !== me) cnt[n] = (cnt[n] || 0) + 1; }));

  return top.length ? `<div class="freq"><span class="lb">자주 함께한 사람</span><div class="fr">${top.map(([n]) => `<button type="button" class="fchip" data-fill="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>` : '';

function isDup(g) {

function backupText() { return JSON.stringify({ app: 'mygamelog', v: 1, at: today(), me, games: games.filter(x => !String(x.id).startsWith('demo')), people: extraPeople, edits, hidden: hiddenP, restored: restoredP }); }
async function restoreBackup(text) {
  const mm = String(text || '').match(/MGL1z?\.[A-Za-z0-9_-]{8,}/);
  if (mm) {
    let s; try { s = await unpackShare(mm[0]); } catch (e) { toast('받은 글이 잘려 있어요. 처음부터 끝까지 다시 복사해 주세요.'); return; }
    if (!s || s.a !== 'mgl-share' || !Array.isArray(s.g)) { toast('PLAY. LOG. PLAY. 기록이 아니에요'); return; }
    if (me && s.me && s.me !== me) { toast(`${s.me} 님의 기록이에요. 내 이름(${me})과 달라서 넣지 않았어요.`); return; }
    const seen = {};
    const gs = s.g.map(x => { const k = x.join('|'); seen[k] = (seen[k] || 0) + 1; let hsh = 2166136261; for (const ch of k + '#' + seen[k]) { hsh ^= ch.codePointAt(0); hsh = Math.imul(hsh, 16777619) >>> 0; } return { id: 'r' + hsh.toString(36), date: x[0], mode: x[1], partner: x[2], opp: [x[3], x[4]], my: x[5], their: x[6], ts: Date.parse(x[0] + 'T12:00:00') || Date.now() }; });
    return restoreBackup(JSON.stringify({ app: 'mygamelog', me: s.me, games: gs }));
  }
  let o; try { o = JSON.parse(String(text).trim()); } catch (e) { toast('백업 코드를 읽지 못했어요. 처음부터 끝까지 그대로 붙여넣어 주세요.'); return; }
  if (!o || o.app !== 'mygamelog' || !Array.isArray(o.games)) { toast('PLAY. LOG. PLAY. 백업이 아니에요'); return; }
  const have = new Set(games.map(g => g.id));
  const add = o.games.filter(g => g && g.id && !String(g.id).startsWith('demo') && /^\d{4}-\d{2}-\d{2}$/.test(String(g.date)) && !have.has(g.id)).map(g => ({ id: String(g.id).slice(0, 40), kind: 'game', date: String(g.date), mode: g.mode === 's' ? 's' : 'd', partner: String(g.partner || '').slice(0, 20), opp: (Array.isArray(g.opp) ? g.opp : []).map(x => String(x).slice(0, 20)).filter(Boolean).slice(0, 2), my: +g.my || 0, their: +g.their || 0, ts: +g.ts || Date.now() }));
  (o.people || []).forEach(p => { if (p && p.n && !extraPeople.find(x => x.n === p.n)) extraPeople.push({ n: String(p.n).slice(0, 20), g: p.g || '', gr: p.gr || '', a: p.a || '' }); });
  edits = { ...(o.edits || {}), ...edits };
  hiddenP = [...new Set([...hiddenP, ...(Array.isArray(o.hidden) ? o.hidden : [])])];
  restoredP = [...new Set([...restoredP, ...(Array.isArray(o.restored) ? o.restored : [])])];
  if (!me && o.me) me = String(o.me).slice(0, 20);
  closeSheet();
  try {
    for (const g of add) await saveGame(g);
    await saveProfile();
    toast(add.length ? `경기 ${add.length}개를 불러왔어요` : '새로 불러올 경기가 없어요. 이미 다 들어 있어요.');
  } catch (e) { toast('일부를 저장하지 못했어요. 다시 시도해 주세요.'); }
}

    let B = [d[3], d[1] === 'd' ? d[4] : ''].filter(Boolean).sort(collator.compare);

function openPlayer(nm) {
  const list = mergedGames().list.filter(g => inClubPeriod(g.date) && g.t.flat().includes(nm));
  const rate = o => (o.w + o.l ? Math.round(o.w / (o.w + o.l) * 100) : '-');
  const tot = { n: 0, w: 0, l: 0 }, part = new Map(), opp = new Map();
  const add = (m, k, r) => { if (!m.has(k)) m.set(k, { n: 0, w: 0, l: 0 }); const o = m.get(k); o.n++; if (r !== 'd') o[r]++; };
  list.forEach(g => {
    const i = g.t[0].includes(nm) ? 0 : 1;
    const r = g.s[i] > g.s[1 - i] ? 'w' : g.s[i] < g.s[1 - i] ? 'l' : 'd';
    tot.n++; if (r !== 'd') tot[r]++;
    g.t[i].filter(x => x !== nm).forEach(x => add(part, x, r));
    g.t[1 - i].forEach(x => add(opp, x, r));
  });
  const rows = m => [...m.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, o]) => `<div class="prow" style="cursor:default"><b>${esc(k)}</b><span class="rec"><strong>${o.w}<em>승</em> ${o.l}<em>패</em></strong><span>${rate(o)}%</span></span><span class="meta">${nf(o.n)}경기</span></div>`).join('');
  openSheet(`
    <div class="shd"><h3>${esc(nm)}</h3><p>${tot.n}경기 ${tot.w}승 ${tot.l}패 · 승률 ${rate(tot)}%</p><button class="shx" type="button" aria-label="닫기">×</button></div>
    <div class="sbody">
      <div class="fl"><span class="lb">함께한 파트너</span>${part.size ? `<div class="plist" style="margin:0">${rows(part)}</div>` : '<p class="hint">복식 파트너 기록이 없어요.</p>'}</div>
      <div class="fl"><span class="lb">만난 상대</span><div class="plist" style="margin:0">${rows(opp)}</div></div>
    </div>`);
}

/* ---------- 명단을 회원들에게 반영 (재용님 화면) ---------- */
function effectiveRoster() {
  return rosterNames(true).concat(me && !rosterNames(true).includes(me) ? [me] : [])
    .filter((n, i, a) => a.indexOf(n) === i)
    .map(n => { const f = infoOf(n); const r = [n, f.g || '', f.gr || '', f.a ? +f.a : '']; if (isOff(n)) r.push(1); return r; })
    .sort((a, b) => collator.compare(a[0], b[0]));
}
function rosterChanges() {
  const now = new Map(ROSTER.map(r => [r[0], JSON.stringify([r[1] || '', r[2] || '', r[3] || '', r[4] ? 1 : 0])]));
  let n = 0;
  effectiveRoster().forEach(r => { const v = JSON.stringify([r[1] || '', r[2] || '', r[3] || '', r[4] ? 1 : 0]); if (now.get(r[0]) !== v) n++; });
  return n;
}
function buildSelf(roster) {
  const MS = '@@' + 'SELF@@', MR = '@@' + 'ROSTER@@';
  const T = SELF_SRC, i = T.indexOf(MS);
  const rj = JSON.stringify(roster).replace(/</g, '\\u003c');
  const fill = s => s.split(MR).join(rj);
  return SKELETON + fill(T.slice(0, i)) + JSON.stringify(T).replace(/</g, '\\u003c') + fill(T.slice(i + MS.length)) + '</body></html>';
}
function openPublishRoster() {
  const n = rosterChanges();
  const sh = openSheet(`
    <div class="shd"><h3>회원들에게 명단 반영</h3><p>바뀐 사람 ${n}명</p><button class="shx" type="button" aria-label="닫기">×</button></div>
    <div class="sbody">
      <div class="infobox">지금 ${esc(OWNER_SHORT)}님 화면의 명단(새 회원, 성별·급수·연령대, 명단에서 뺀 사람)이 앱의 기본 명단이 돼요. 회원들은 다음에 앱을 열 때부터 바뀐 명단을 봐요.</div>
      <p class="hint">회원이 자기 폰에서 따로 고친 내용은 그 사람 화면에서 계속 우선해요. 올리고 나면 이 화면이 한 번 새로 고쳐져요.</p>
    </div>
    <div class="sfoot"><button class="btn" type="button" id="pbNo">취소</button><button class="btn primary" type="button" id="pbYes">반영하기</button></div>`);
  sh.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'pbNo') closeSheet();
    if (b.id !== 'pbYes') return;
    b.disabled = true; b.textContent = '올리는 중…';
    try {
      const art = window.claude?.use ? await claude.use('artifact') : null;
      if (!art) throw { code: 'not_granted' };
      try { sessionStorage.setItem('mgl.published', '1'); } catch (x) {}
      await art.publish(buildSelf(effectiveRoster()));
    } catch (er) {
      try { sessionStorage.removeItem('mgl.published'); } catch (x) {}
      b.disabled = false; b.textContent = '반영하기';
      const c = er && er.code;
      toast(c === 'conflict' ? '앱이 다른 곳에서 먼저 바뀌어서 새로 불러와요. 다시 시도해 주세요.'
        : c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled' ? '이 화면에서는 새 버전을 올릴 수 없어요. Claude 앱에서 로그인한 채로 열어 주세요.'
        : c === 'rate_limited' ? '잠시 뒤에 다시 시도해 주세요.'
        : '올리지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    }
  });
}

// 홈 한 줄 인사이트: 지금 가장 의미 있는 이야기 하나
function insight() {
  const seq = sorted();
  if (!seq.length) return null;
  // 특정 상대에게 연패 중
  const streakVs = {};
  for (let i = seq.length - 1; i >= 0; i--) {
    const g = seq[i], r = resOf(g);

// 클럽 레이팅(엘로): 강한 상대를 이길수록 많이 오름
function clubRatings(list) {
  const R = new Map(), N = new Map(), get = p => R.has(p) ? R.get(p) : 1500;
  list.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(gm => {
    const res = gm.r || (gm.s[0] > gm.s[1] ? 'w' : gm.s[0] < gm.s[1] ? 'l' : 'd');
    if (res === 'd') return;
    const ra = gm.t[0].reduce((s, p) => s + get(p), 0) / gm.t[0].length, rb = gm.t[1].reduce((s, p) => s + get(p), 0) / gm.t[1].length;
    const ea = 1 / (1 + Math.pow(10, (rb - ra) / 400)), sa = res === 'w' ? 1 : 0, K = 32;
    gm.t[0].forEach(p => { R.set(p, get(p) + K * (sa - ea)); N.set(p, (N.get(p) || 0) + 1); });
    gm.t[1].forEach(p => { R.set(p, get(p) + K * ((1 - sa) - (1 - ea))); N.set(p, (N.get(p) || 0) + 1); });
  });
  return [...R.entries()].map(([nm, r]) => ({ nm, r: Math.round(r), n: N.get(nm) || 0 })).sort((a, b) => b.r - a.r);
}

$('#clubBody').addEventListener('click', async e => {
  const d = e.target.closest('[data-delmem]');
  if (d) { if (!d.dataset.sure) { d.dataset.sure = '1'; d.textContent = '정말 빼기'; return; } const id = d.dataset.delmem; try { await col.doc(id).delete(); members = members.filter(m => m.id !== id); renderClub(); toast('받은 기록을 뺐어요'); } catch (er) { toast('빼지 못했어요. 다시 시도해 주세요.'); } return; }
  const bk = e.target.closest('[data-backmem]');
  if (bk) {
    const m = members.find(x => x.id === bk.dataset.backmem); if (!m) return;
    const code = await packShare({ a: 'mgl-share', v: 1, me: m.name, at: m.at || today(), g: m.g || [] });
    const text = `[PLAY. LOG. PLAY. 기록 돌려받기] ${m.name} · ${(m.g || []).length}경기\n앱 오른쪽 위 이름 버튼 → "${OWNER_SHORT}님께 받은 기록 넣기"에 이 글을 통째로 붙여넣으세요.\n${code}`;
    try { await navigator.clipboard.writeText(text); toast(`${m.name} 님 기록을 복사했어요. 카톡으로 보내 주세요.`); }
    catch (er) { const sh = openSheet(`<div class="shd"><h3>${esc(m.name)} 님께 돌려줄 기록</h3><p>길게 눌러 전체 선택 후 복사해서 카톡으로 보내 주세요.</p><button class="shx" type="button" aria-label="닫기">×</button></div><div class="sbody"><textarea readonly style="min-height:160px">${esc(text)}</textarea></div>`); const ta = sh.querySelector('textarea'); ta.focus(); ta.select(); }
    return;
  }
  const rp = e.target.closest('[data-rp]'); if (rp) { rankPeriod = rp.dataset.rp; renderClub(); return; }
  if (e.target.closest('#rankMore')) { const w = $('#rankWrap'); w.classList.toggle('fold'); e.target.closest('#rankMore').textContent = w.classList.contains('fold') ? `전체 ${w.querySelectorAll('tbody tr').length}명 보기` : '접기'; return; }
  const cb = e.target.closest('[data-club]'); if (cb) { cb.dataset.club === 'senders' ? openSenders() : openPlayers(); return; }
  const p = e.target.closest('[data-player]'); if (p) openPlayer(p.dataset.player);
});
try { if (sessionStorage.getItem('mgl.published')) { sessionStorage.removeItem('mgl.published'); setTimeout(() => toast('회원들에게 명단을 반영했어요'), 1200); } } catch (e) {}
$('#pSort').addEventListener('click', e => { const b = e.target.closest('.fchip'); if (b) { pSort = b.dataset.s; renderPeople(); } });
$('#roleSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { role = b.dataset.r; renderPeople(); } });
$('#rosterBtn').addEventListener('click', () => { if (isOwner) openRoster(); });
$('#meBtn').addEventListener('click', () => openMe(!me));
$('#peopleBody').addEventListener('click', e => { const p = e.target.closest('[data-person]'); if (p) openPerson(p.dataset.person); });

document.documentElement.lang = 'ko';
boot();
})();
</script>
